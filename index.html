e l’écart de performance, pas le rendement ni le risque total du portefeuille."},{"label":"Relier risque relatif et réussite","text":"Le ratio d’information rapporte la surperformance moyenne à la tracking error. Il permet de distinguer un gérant qui s’écarte beaucoup sans résultat d’un gérant qui obtient un excès de performance relativement régulier."},{"label":"Une limite importante","text":"Une tracking error faible ne signifie pas que le portefeuille soit peu risqué en absolu : un fonds qui suit fidèlement un indice très volatil aura une petite tracking error mais un risque de marché potentiellement élevé."}]},{"id":"treynor","title":"Ratio de Treynor","group":"03 · Portefeuille & performance","page":"32","chapter":6,"subtitle":"Prime de risque rapportée au bêta","what":"Le ratio de Treynor est (R_p−R_f)/β_p pour un bêta non nul. Contrairement au Sharpe, il rapporte le rendement excédentaire à l’exposition systématique mesurée par le bêta, pas à toute la volatilité.","how":"Il est surtout informatif lorsque le risque spécifique est bien diversifié et que le bêta est positif et stable. Un bêta presque nul ou négatif rend la comparaison délicate.","worked":"Un fonds gagne 11 %, le taux sans risque vaut 3 % et β=1,6 : Treynor = 8 % / 1,6 = 5 points de rendement par unité de bêta.","trap":"Comparer un ratio de Treynor et un Sharpe comme s’ils avaient la même unité et la même interprétation est une erreur.","visual":"risk","scenario":"Un fonds très diversifié a un Sharpe modéré mais un bon Treynor. Quelle différence d’interprétation explique cet écart ?","answers":["Treynor se concentre sur le risque systématique","Treynor utilise toujours le nombre de titres","Sharpe ignore complètement la volatilité"],"correct":0,"feedback":"Treynor normalise par le bêta ; Sharpe par le risque total.","q2":{"scenario":"Portefeuille +10 %, sans risque +2 %, bêta de 1,6. Quel Treynor ?","answers":["5 points par unité de bêta","1,6 %","8 % de volatilité"],"correct":0,"feedback":"(10−2)/1,6=5 points de rendement pour une unité de bêta."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Ratio de Treynor ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Ratio de Treynor » en deux phrases.","a":"Le ratio de Treynor est (R_p−R_f)/β_p pour un bêta non nul. Contrairement au Sharpe, il rapporte le rendement excédentaire à l’exposition systématique mesurée par le bêta, pas à toute la volatilité."},{"q":"Quels mécanismes ou facteurs font varier « Ratio de Treynor » ?","a":"Il est surtout informatif lorsque le risque spécifique est bien diversifié et que le bêta est positif et stable. Un bêta presque nul ou négatif rend la comparaison délicate."},{"q":"Quel piège d'interprétation faut-il éviter avec « Ratio de Treynor » ?","a":"Comparer un ratio de Treynor et un Sharpe comme s’ils avaient la même unité et la même interprétation est une erreur."}],"depth":[{"label":"Le risque pris comme dénominateur","text":"Le ratio de Treynor utilise le bêta au marché et non la volatilité totale. Il mesure la prime de rendement par unité de risque systématique, sous les hypothèses du modèle."},{"label":"Comparaison avec Sharpe","text":"Sharpe tient compte de toute la dispersion des rendements ; Treynor cherche une rémunération du risque exposé au marché. Deux portefeuilles peuvent être classés différemment si leurs risques spécifiques ne sont pas les mêmes."},{"label":"Attention aux cas limites","text":"Le ratio devient délicat à interpréter lorsque le bêta est très proche de zéro ou négatif. Comme tout ratio, il ne constitue pas à lui seul un critère de sélection robuste."}]},{"id":"var","title":"Value at Risk (VaR)","group":"04 · Risques & crises","page":"33–38","chapter":7,"subtitle":"Un quantile de perte, pas une perte maximale absolue","what":"La VaR au niveau 99 % et à horizon un jour est un seuil de perte tel que la probabilité modélisée de le dépasser est de l’ordre de 1 % sur cet horizon. Son calcul exige de préciser le modèle, les données et l’horizon ; elle ne décrit pas la gravité des pertes au-delà du seuil.","how":"On peut l’estimer empiriquement sur un historique, avec un modèle paramétrique ou par simulation Monte Carlo. Le poly en présente une approche normale et explique ses limites : asymétrie et queues épaisses des rendements. Un backtest confronte les seuils de VaR aux pertes effectivement observées.","worked":"Pour une série hypothétique de pertes en euros, la VaR 95 % est le quantile 95 % de la distribution des pertes. Une perte encore plus élevée peut survenir dans les 5 % de scénarios restant.","trap":"« VaR 99 %=1 M€ » ne veut pas dire qu’une perte supérieure à 1 M€ est impossible. Cela n’implique pas non plus 99 % de confiance sur toute durée ou tout modèle.","visual":"risk","scenario":"Une VaR à 99 % sur une journée vaut 1 million d’euros. La journée suivante, le portefeuille perd 4 millions. Quelle interprétation est correcte ?","answers":["Le modèle mathématique est forcément erroné","C’est une exception possible : la VaR ne borne pas les pertes au-delà du seuil","Cette perte est impossible par définition"],"correct":1,"feedback":"Un quantile n’est pas une perte maximale. Plusieurs exceptions peuvent signaler une mauvaise calibration, mais une seule n’est pas contradictoire.","q2":{"scenario":"Sur 250 jours, une VaR 99 % correctement calibrée conduit en moyenne à combien de dépassements, sans garantir le nombre exact ?","answers":["2,5","25","0"],"correct":0,"feedback":"250 × (1−0,99) = 2,5 dépassements attendus, sous les hypothèses du modèle."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Value at Risk (VaR) ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Value at Risk (VaR) » en deux phrases.","a":"La VaR au niveau 99 % et à horizon un jour est un seuil de perte tel que la probabilité modélisée de le dépasser est de l’ordre de 1 % sur cet horizon. Son calcul exige de préciser le modèle, les données et l’horizon ; elle ne décrit pas la gravité des pertes au-delà du seuil."},{"q":"Quels mécanismes ou facteurs font varier « Value at Risk (VaR) » ?","a":"On peut l’estimer empiriquement sur un historique, avec un modèle paramétrique ou par simulation Monte Carlo. Le poly en présente une approche normale et explique ses limites : asymétrie et queues épaisses des rendements. Un backtest confronte les seuils de VaR aux pertes effectivement observées."},{"q":"Quel piège d'interprétation faut-il éviter avec « Value at Risk (VaR) » ?","a":"« VaR 99 %=1 M€ » ne veut pas dire qu’une perte supérieure à 1 M€ est impossible. Cela n’implique pas non plus 99 % de confiance sur toute durée ou tout modèle."}],"depth":[{"label":"Définition en quantile","text":"Une VaR 99 % à un jour est un seuil de perte que le modèle prévoit dépasser environ 1 % des jours, pour l’horizon et les hypothèses définis. Elle ne dit pas combien on perd au-delà."},{"label":"Méthodes possibles","text":"Une VaR peut être estimée à partir d’un historique, d’une hypothèse paramétrique ou de simulations. Les résultats dépendent des données, des facteurs de risque et de la manière de valoriser les instruments."},{"label":"Vérifier le modèle","text":"Un backtest compare les dépassements réels aux prévisions ; un stress test explore des scénarios sévères. L’Expected Shortfall étudie la moyenne des pertes dans la queue au-delà du quantile."}]},{"id":"stress","title":"Stress tests et risque extrême","group":"04 · Risques & crises","page":"34–38, 55–75","chapter":7,"subtitle":"Prévoir ce qui résiste aux chocs rares","what":"Un stress test évalue les pertes et mécanismes de transmission sous un scénario sévère mais plausible : hausse de taux, contraction de liquidité, défauts corrélés ou rupture de change. Contrairement à une statistique résumant la distribution habituelle, il force un scénario particulier.","how":"Les scénarios peuvent être historiques (rejouer une crise) ou hypothétiques (combiner chocs cohérents). Un bon stress test examine aussi la capacité de financement, les appels de marge et l’effet des réactions de marché.","worked":"Une banque détient des obligations longues et se finance à court terme. Un choc combiné « taux +200 points de base, spread de crédit +100 points, dépôts en fuite » peut coûter davantage que la somme de trois chocs isolés.","trap":"Un scénario ne mesure pas sa propre probabilité. Il faut distinguer sévérité, plausibilité et fréquence.","visual":"risk","scenario":"Une stratégie a une VaR quotidienne faible, mais elle vend une protection qui peut coûter très cher en crise. Quel outil complémentaire convient ?","answers":["Un stress test de scénarios extrêmes","Le seul rendement de la veille","La capitalisation de l’émetteur"],"correct":0,"feedback":"Une option vendue peut avoir des pertes rares et massives, peu visibles dans une VaR fondée sur le calme passé.","q2":{"scenario":"Deux actifs peuvent subir simultanément un choc de taux et une fuite de liquidité. Quelle pratique améliore le plus ton stress test ?","answers":["Additionner toujours les chocs sans interaction","Introduire des boucles de vente forcée et d’appels de marge cohérentes","Ignorer les coûts de liquidation"],"correct":1,"feedback":"Les scénarios combinés sont parfois non linéaires ; liquidité et financement aggravent les prix."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Stress tests et risque extrême ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Stress tests et risque extrême » en deux phrases.","a":"Un stress test évalue les pertes et mécanismes de transmission sous un scénario sévère mais plausible : hausse de taux, contraction de liquidité, défauts corrélés ou rupture de change. Contrairement à une statistique résumant la distribution habituelle, il force un scénario particulier."},{"q":"Quels mécanismes ou facteurs font varier « Stress tests et risque extrême » ?","a":"Les scénarios peuvent être historiques (rejouer une crise) ou hypothétiques (combiner chocs cohérents). Un bon stress test examine aussi la capacité de financement, les appels de marge et l’effet des réactions de marché."},{"q":"Quel piège d'interprétation faut-il éviter avec « Stress tests et risque extrême » ?","a":"Un scénario ne mesure pas sa propre probabilité. Il faut distinguer sévérité, plausibilité et fréquence."}],"depth":[{"label":"Pourquoi les quantiles ne suffisent pas","text":"Une VaR modélisée sur des variations usuelles ne détaille pas le comportement du portefeuille si la liquidité disparaît ou si plusieurs marchés chutent ensemble. Les chocs extrêmes et les ruptures de régime demandent une analyse séparée."},{"label":"Construire un scénario utile","text":"Un stress test précise une histoire économique cohérente : hausse brutale des taux, élargissement des spreads, chute des actions ou dépréciation d’une devise. Les facteurs doivent être appliqués aux positions, puis la perte recalculée."},{"label":"Exploiter le résultat","text":"Le but n’est pas de prédire une date exacte de crise. Il s’agit d’identifier les fragilités, de tester les fonds propres ou la liquidité, et de réfléchir à des limites et à des plans d’action."}]},{"id":"duration","title":"Duration et sensibilité aux taux","group":"04 · Risques & crises","page":"170–175","chapter":19,"subtitle":"Pourquoi les obligations longues bougent davantage","what":"La duration mesure, selon sa définition, la structure temporelle des flux d’une obligation ; la duration modifiée permet d’approximer la sensibilité relative du prix à une petite variation du rendement. À premier ordre : ΔP/P ≈ −D_mod × Δy.","how":"Toutes choses égales par ailleurs, une duration modifiée élevée signifie une forte exposition aux taux. La convexité améliore l’approximation pour de grands chocs. Cette relation ne prend pas à elle seule en compte les variations du risque de crédit.","worked":"Une obligation vaut 1 000 € et présente une duration modifiée de 6. Si le rendement monte de 0,50 point, soit Δy=0,005, variation approchée : −6×0,005=−3 %, donc environ −30 €.","trap":"Il faut convertir 50 points de base en 0,005, pas en 0,5. Et une duration modifiée n’est pas « exactement la date d’échéance ».","visual":"bond","scenario":"Deux obligations ont des durations modifiées de 2 et 8. Un choc parallèle de +1 % touche les deux. En première approximation, laquelle baisse davantage ?","answers":["Celle de duration 2","Celle de duration 8","Aucune, les obligations ne baissent pas avec les taux"],"correct":1,"feedback":"La baisse relative est approximativement −D_mod × Δy : environ −8 % contre −2 %.","q2":{"scenario":"Une obligation affiche une duration modifiée de 6. Les rendements montent de 50 points de base. Quelle variation relative approximative ?","answers":["+3 %","−3 %","−30 %"],"correct":1,"feedback":"−6×0,005=−0,03, soit −3 %, avant correction de convexité."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Duration et sensibilité aux taux ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Duration et sensibilité aux taux » en deux phrases.","a":"La duration mesure, selon sa définition, la structure temporelle des flux d’une obligation ; la duration modifiée permet d’approximer la sensibilité relative du prix à une petite variation du rendement. À premier ordre : ΔP/P ≈ −D_mod × Δy."},{"q":"Quels mécanismes ou facteurs font varier « Duration et sensibilité aux taux » ?","a":"Toutes choses égales par ailleurs, une duration modifiée élevée signifie une forte exposition aux taux. La convexité améliore l’approximation pour de grands chocs. Cette relation ne prend pas à elle seule en compte les variations du risque de crédit."},{"q":"Quel piège d'interprétation faut-il éviter avec « Duration et sensibilité aux taux » ?","a":"Il faut convertir 50 points de base en 0,005, pas en 0,5. Et une duration modifiée n’est pas « exactement la date d’échéance »."}],"depth":[{"label":"Sensibilité locale au rendement","text":"La duration modifiée D donne, au premier ordre, ΔP/P≈−D·Δy. Une duration de 7 suggère donc près de −7 % pour une hausse de rendement de 1 point, avant correction de convexité."},{"label":"Ce n’est pas seulement l’échéance","text":"La duration dépend des dates et de l’importance des flux, pas uniquement de la date de remboursement final. Deux obligations de même maturité peuvent avoir des durations différentes."},{"label":"Applications ALM","text":"L’assureur compare la sensibilité de ses actifs financiers à celle des engagements envers les assurés. Un choc de taux peut modifier différemment les deux côtés du bilan."}]},{"id":"credit","title":"Risque de crédit et spread","group":"04 · Risques & crises","page":"174–176, 61–73","chapter":19,"subtitle":"Le marché rémunère aussi la possibilité de défaut","what":"Le risque de crédit est le risque que l’emprunteur n’honore pas les paiements attendus. Le spread de crédit est un surplus de rendement exigé par rapport à une référence de taux et de maturité comparables, qui reflète notamment défaut, liquidité et aversion au risque.","how":"Une hausse du spread de crédit fait généralement baisser le prix d’une obligation d’entreprise, même lorsque les taux sans risque sont stables. Le terme « high yield » désigne généralement une dette à notation spéculative ; il décrit une catégorie de risque et de rendement exigé, pas une garantie de gain.","worked":"Obligation d’État de référence à 3 %, obligation entreprise similaire à 5,2 % : écart brut de 2,2 points, soit 220 points de base. L’interprétation précise demande de comparer les structures et horizons.","trap":"Le spread n’est pas une probabilité de défaut pure : liquidité, clauses et prime de risque en influencent le niveau.","visual":"bond","scenario":"Les taux sans risque ne bougent pas, mais la qualité de crédit d’une entreprise se dégrade. Son obligation à taux fixe tend à…","answers":["Prendre de la valeur","Perdre de la valeur si le spread exigé augmente","Devenir automatiquement une action"],"correct":1,"feedback":"Plus de rendement exigé signifie un prix actualisé plus faible, toutes choses égales par ailleurs.","q2":{"scenario":"Taux de référence à 3,1 %, obligation d’entreprise comparable à 4,8 %. Quel spread brut ?","answers":["17 points de base","170 points de base","1 700 points de base"],"correct":1,"feedback":"4,8−3,1=1,7 point de pourcentage = 170 points de base."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Risque de crédit et spread ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Risque de crédit et spread » en deux phrases.","a":"Le risque de crédit est le risque que l’emprunteur n’honore pas les paiements attendus. Le spread de crédit est un surplus de rendement exigé par rapport à une référence de taux et de maturité comparables, qui reflète notamment défaut, liquidité et aversion au risque."},{"q":"Quels mécanismes ou facteurs font varier « Risque de crédit et spread » ?","a":"Une hausse du spread de crédit fait généralement baisser le prix d’une obligation d’entreprise, même lorsque les taux sans risque sont stables. Le terme « high yield » désigne généralement une dette à notation spéculative ; il décrit une catégorie de risque et de rendement exigé, pas une garantie de gain."},{"q":"Quel piège d'interprétation faut-il éviter avec « Risque de crédit et spread » ?","a":"Le spread n’est pas une probabilité de défaut pure : liquidité, clauses et prime de risque en influencent le niveau."}],"depth":[{"label":"Capacité et volonté de rembourser","text":"Le risque de crédit concerne la défaillance de l’emprunteur, mais aussi les changements de qualité perçue avant le défaut. Une dégradation de notation peut faire augmenter le rendement exigé et baisser le prix de l’obligation."},{"label":"Décomposer un rendement","text":"Le rendement d’une obligation d’entreprise incorpore des taux de base et une prime de crédit. Le spread varie avec la probabilité de défaut, la perte en cas de défaut, la liquidité et les conditions de marché."},{"label":"Lecture en termes de risque","text":"En risque de crédit, une première décomposition consiste à regarder PD, LGD et EAD pour obtenir une perte attendue approximative. Ce n’est pas la même chose que la volatilité quotidienne du cours d’une action."}]},{"id":"titrisation","title":"Titrisation, MBS et CDO","group":"04 · Risques & crises","page":"67–73","chapter":11,"subtitle":"Transformer des créances en titres","what":"La titrisation regroupe des créances (par exemple des prêts immobiliers) et finance leur acquisition via l’émission de titres adossés à ces flux. Un MBS est adossé à des créances hypothécaires ; certains CDO regroupent divers actifs ou expositions puis répartissent les pertes en tranches.","how":"Une tranche senior absorbe généralement les pertes après les tranches subordonnées, mais elle n’est pas dépourvue de risque. Les agences de notation, la qualité des prêts et les hypothèses de corrélation jouent des rôles essentiels dans la structure.","worked":"Sur 100 M€ de prêts, une première tranche de 10 M€ absorbe les premières pertes. Si les pertes agrégées sont de 8 M€, elle subit l’intégralité de ces pertes ; la tranche senior n’en subit pas encore.","trap":"Le transfert juridique et économique du risque n’est pas forcément complet. Le poly traite le sujet dans le contexte historique de la crise des subprimes.","visual":"structure","scenario":"Un portefeuille titrisé subit 6 M€ de pertes et la tranche equity absorbe les 10 premiers millions. Quelle tranche perd en premier ?","answers":["La tranche equity","La tranche senior","Toutes les tranches également"],"correct":0,"feedback":"La subordination organise la priorité d’absorption des pertes. Elle ne supprime pas leur risque global.","q2":{"scenario":"Tranche equity absorbe les 10 premiers millions de pertes, mezzanine les 10 suivants. Pertes réalisées : 15 millions. Combien de pertes pour la mezzanine ?","answers":["0 M€","5 M€","15 M€"],"correct":1,"feedback":"Les 10 premiers millions touchent equity, les 5 suivants la mezzanine."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Titrisation, MBS et CDO ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Titrisation, MBS et CDO » en deux phrases.","a":"La titrisation regroupe des créances (par exemple des prêts immobiliers) et finance leur acquisition via l’émission de titres adossés à ces flux. Un MBS est adossé à des créances hypothécaires ; certains CDO regroupent divers actifs ou expositions puis répartissent les pertes en tranches."},{"q":"Quels mécanismes ou facteurs font varier « Titrisation, MBS et CDO » ?","a":"Une tranche senior absorbe généralement les pertes après les tranches subordonnées, mais elle n’est pas dépourvue de risque. Les agences de notation, la qualité des prêts et les hypothèses de corrélation jouent des rôles essentiels dans la structure."},{"q":"Quel piège d'interprétation faut-il éviter avec « Titrisation, MBS et CDO » ?","a":"Le transfert juridique et économique du risque n’est pas forcément complet. Le poly traite le sujet dans le contexte historique de la crise des subprimes."}],"depth":[{"label":"Transformer des créances en titres","text":"La titrisation rassemble des créances dont les remboursements deviennent les flux d’un véhicule financier. Les investisseurs achètent des titres adossés à ces flux, avec des règles contractuelles de priorité des paiements."},{"label":"La structure des tranches","text":"Une tranche junior absorbe généralement les premières pertes et peut offrir un rendement plus élevé. Une tranche senior est plus protégée par la subordination, mais sa qualité dépend de la structure et des défauts corrélés des créances."},{"label":"Leçon des crises","text":"Transférer juridiquement une créance ne fait pas disparaître son risque du système. Les défauts corrélés, les garanties insuffisantes et le manque de transparence peuvent contaminer plusieurs intermédiaires."}]},{"id":"cds","title":"Credit Default Swap (CDS)","group":"04 · Risques & crises","page":"68–73","chapter":11,"subtitle":"Un contrat lié au défaut d’un emprunteur","what":"Un CDS est un dérivé de crédit dans lequel un acheteur de protection paie une prime à un vendeur qui s’engage à compenser une perte définie lors d’un événement de crédit contractuel. Il est utilisé pour transférer une exposition au défaut ou prendre une position sur le risque de crédit.","how":"Le CDS introduit un risque de contrepartie et dépend de définitions contractuelles. Son spread varie notamment avec le risque de défaut anticipé, la liquidité et les conditions de marché. Les crises montrent que les couvertures de crédit peuvent être interconnectées.","worked":"Une banque détient une obligation d’entreprise et achète un CDS sur ce même émetteur. Elle cherche à couvrir une partie du risque de défaut, mais doit aussi évaluer la solidité du vendeur de protection.","trap":"Un CDS n’est pas la même chose qu’une obligation ni une assurance standard. Les conditions de paiement et les événements couverts sont contractuels.","visual":"structure","scenario":"Une banque couvre une créance risquée avec un CDS, mais son vendeur de protection fait faillite au même moment que le débiteur. Quel risque a été mal maîtrisé ?","answers":["Le risque de contrepartie / risque de corrélation défavorable","Le seul risque de change","Le risque de dividende"],"correct":0,"feedback":"La couverture vaut aussi par la solvabilité de celui qui la fournit.","q2":{"scenario":"Un investisseur achète un CDS sans posséder l’obligation référencée. Quel risque prend-il ?","answers":["Il ne peut rien perdre","Une exposition au spread et au crédit par dérivé","Il devient nécessairement propriétaire de l’entreprise"],"correct":1,"feedback":"Un CDS peut servir à la couverture ou à la prise de risque indépendante de la détention de dette."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Credit Default Swap (CDS) ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Credit Default Swap (CDS) » en deux phrases.","a":"Un CDS est un dérivé de crédit dans lequel un acheteur de protection paie une prime à un vendeur qui s’engage à compenser une perte définie lors d’un événement de crédit contractuel. Il est utilisé pour transférer une exposition au défaut ou prendre une position sur le risque de crédit."},{"q":"Quels mécanismes ou facteurs font varier « Credit Default Swap (CDS) » ?","a":"Le CDS introduit un risque de contrepartie et dépend de définitions contractuelles. Son spread varie notamment avec le risque de défaut anticipé, la liquidité et les conditions de marché. Les crises montrent que les couvertures de crédit peuvent être interconnectées."},{"q":"Quel piège d'interprétation faut-il éviter avec « Credit Default Swap (CDS) » ?","a":"Un CDS n’est pas la même chose qu’une obligation ni une assurance standard. Les conditions de paiement et les événements couverts sont contractuels."}],"depth":[{"label":"Protection contre un événement de crédit","text":"Dans un CDS, l’acheteur paie une prime périodique et le vendeur s’engage à indemniser selon les modalités contractuelles si un événement de crédit défini survient. Le CDS est un dérivé de crédit, pas une action de l’émetteur."},{"label":"Comprendre le spread","text":"Un spread CDS qui augmente signifie en général que la protection est devenue plus coûteuse. Cela peut refléter une hausse de risque de crédit perçu, de prime de risque ou des tensions de liquidité."},{"label":"Des risques nouveaux","text":"L’acheteur ne se débarrasse pas de tous les risques : si le vendeur de protection fait défaut, la couverture peut échouer. C’est une illustration du risque de contrepartie et des interconnexions systémiques."}]},{"id":"systemique","title":"Risque systémique et contagion","group":"04 · Risques & crises","page":"18–19, 51–75","chapter":10,"subtitle":"Quand les difficultés se transmettent entre acteurs","what":"Le risque systémique concerne la propagation de difficultés d’un acteur ou marché à un ensemble plus vaste du système financier. Interdépendances, financement court, appels de marge et ventes forcées peuvent amplifier un choc initial.","how":"Le cours illustre la contagion à travers LTCM en 1998 et les subprimes en 2007–2008. Ces exemples historiques montrent qu’un portefeuille individuellement couvert peut participer à un risque collectif, notamment lorsque plusieurs agents détiennent les mêmes positions.","worked":"Une baisse d’actifs oblige plusieurs fonds à vendre simultanément pour honorer leurs appels de marge. Ces ventes font encore baisser les prix, accentuant la pression initiale : boucle de rétroaction négative.","trap":"Le risque « systémique » au sens de contagion ne se confond pas automatiquement avec le risque « systématique » de marché utilisé en théorie du portefeuille.","visual":"risk","scenario":"Plusieurs fonds doivent liquider simultanément des positions semblables à cause d’appels de marge. Pourquoi la perte peut-elle s’amplifier ?","answers":["Parce que les ventes forcées aggravent la baisse des prix","Parce que le bêta de toutes les actions devient zéro","Parce qu’un ordre limite garantit toujours l’exécution"],"correct":0,"feedback":"Le désendettement collectif peut créer une spirale prix-liquidité.","q2":{"scenario":"Pourquoi un financement de long terme par de la dette très courte peut-il amplifier une crise ?","answers":["La dette courte supprime les problèmes de liquidité","Le refinancement peut disparaître précisément lors du choc","Il garantit la solvabilité"],"correct":1,"feedback":"Une crise de liquidité peut forcer des ventes, même sur des actifs qui seraient rentables à long terme."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Risque systémique et contagion ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Risque systémique et contagion » en deux phrases.","a":"Le risque systémique concerne la propagation de difficultés d’un acteur ou marché à un ensemble plus vaste du système financier. Interdépendances, financement court, appels de marge et ventes forcées peuvent amplifier un choc initial."},{"q":"Quels mécanismes ou facteurs font varier « Risque systémique et contagion » ?","a":"Le cours illustre la contagion à travers LTCM en 1998 et les subprimes en 2007–2008. Ces exemples historiques montrent qu’un portefeuille individuellement couvert peut participer à un risque collectif, notamment lorsque plusieurs agents détiennent les mêmes positions."},{"q":"Quel piège d'interprétation faut-il éviter avec « Risque systémique et contagion » ?","a":"Le risque « systémique » au sens de contagion ne se confond pas automatiquement avec le risque « systématique » de marché utilisé en théorie du portefeuille."}],"depth":[{"label":"Au-delà de la somme des risques individuels","text":"Une banque peut paraître solvable isolément tout en étant vulnérable aux réactions des autres acteurs. Si tous doivent vendre les mêmes actifs, leurs ventes font baisser les prix et aggravent mutuellement leurs pertes."},{"label":"Les canaux de contagion","text":"Les liens de financement interbancaire, les dérivés de gré à gré, les garanties et la défiance peuvent diffuser un choc de crédit vers une crise de liquidité puis de solvabilité."},{"label":"Pourquoi un stress test conjoint","text":"Il faut tester plusieurs bilans et marchés simultanément. Un stress test qui conserve une liquidité parfaite et des corrélations historiques calmes risque de masquer les mécanismes de contagion."}]},{"id":"inflation","title":"Inflation et pouvoir d’achat","group":"05 · Macroéconomie","page":"48, 82–84","chapter":9,"subtitle":"La hausse persistante du niveau général des prix","what":"L’inflation désigne l’augmentation du niveau général des prix des biens et services sur une période. Elle érode le pouvoir d’achat d’un montant nominal donné. Ses causes possibles incluent des chocs d’offre, des tensions de demande et des mécanismes monétaires ; l’intensité dépend du contexte économique.","how":"Un investisseur doit distinguer rendement nominal et rendement réel. La relation approximative est r_réel ≈ r_nominal−inflation pour des taux faibles ; la relation exacte est (1+r_nominal)/(1+inflation)−1. Les anticipations d’inflation peuvent influencer les taux et la valorisation des actifs.","worked":"Placement +5 %, inflation +3 %. Rendement réel exact : 1,05/1,03−1 ≈ 1,94 %. Ton compte affiche davantage d’euros, mais ton pouvoir d’achat progresse moins vite.","trap":"Le poly présente une interprétation très monétaire de l’inflation ; c’est une perspective historique du cours, pas une définition exhaustive de toutes les causes possibles.","visual":"macro","scenario":"Ton portefeuille a gagné 4 % en euros sur l’année, alors que les prix ont augmenté de 6 %. Que s’est-il passé en pouvoir d’achat ?","answers":["Gain réel d’environ 10 %","Perte réelle d’environ 1,9 %","Pouvoir d’achat strictement inchangé"],"correct":1,"feedback":"1,04/1,06−1 ≈ −1,89 %. Le rendement nominal positif ne suffit pas.","q2":{"scenario":"Un investissement gagne 10 % et l’inflation est de 5 %. Rendement réel exact approximatif ?","answers":["5 %","4,76 %","15 %"],"correct":1,"feedback":"1,10/1,05−1≈4,76 %. La simple différence donne 5 %, une approximation."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Inflation et pouvoir d’achat ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Inflation et pouvoir d’achat » en deux phrases.","a":"L’inflation désigne l’augmentation du niveau général des prix des biens et services sur une période. Elle érode le pouvoir d’achat d’un montant nominal donné. Ses causes possibles incluent des chocs d’offre, des tensions de demande et des mécanismes monétaires ; l’intensité dépend du contexte économique."},{"q":"Quels mécanismes ou facteurs font varier « Inflation et pouvoir d’achat » ?","a":"Un investisseur doit distinguer rendement nominal et rendement réel. La relation approximative est r_réel ≈ r_nominal−inflation pour des taux faibles ; la relation exacte est (1+r_nominal)/(1+inflation)−1. Les anticipations d’inflation peuvent influencer les taux et la valorisation des actifs."},{"q":"Quel piège d'interprétation faut-il éviter avec « Inflation et pouvoir d’achat » ?","a":"Le poly présente une interprétation très monétaire de l’inflation ; c’est une perspective historique du cours, pas une définition exhaustive de toutes les causes possibles."}],"depth":[{"label":"Nominal et réel","text":"Ce qui compte pour le pouvoir d’achat n’est pas uniquement le rendement affiché. La relation exacte est 1+rᵣ=(1+rₙ)/(1+π), où rᵣ est réel, rₙ nominal et π l’inflation."},{"label":"Plusieurs causes possibles","text":"La hausse générale des prix peut être alimentée par la demande, les coûts, les anticipations ou des chocs d’offre. Une analyse qui attribue tout changement des prix à un seul canal serait trop simpliste."},{"label":"Impact sur actifs","text":"L’inflation affecte les revenus réels, les marges, les banques centrales et les taux exigés. L’effet sur actions et obligations dépend aussi des anticipations déjà intégrées dans les prix."}]},{"id":"taux","title":"Taux directeurs et banque centrale","group":"05 · Macroéconomie","page":"49–54, 82–88","chapter":9,"subtitle":"Le prix de la liquidité influence toute l’économie","what":"Les banques centrales fixent des taux clés qui influencent le financement très court et les conditions de crédit. Elles conduisent la politique monétaire pour atteindre leurs objectifs, notamment la stabilité des prix. La transmission aux ménages et entreprises dépend aussi des banques, de la concurrence et des anticipations.","how":"Une hausse des taux directeurs tend à renchérir le crédit et à freiner la demande, avec un décalage et des effets variables. Elle modifie les courbes de taux, les valorisations obligataires et les calculs de valeur actuelle des actions, sans déterminer à elle seule la direction du marché.","worked":"Si le taux d’actualisation d’un flux de 100 € dans cinq ans passe de 2 % à 5 %, sa valeur présente descend d’environ 90,57 € à 78,35 €.","trap":"Une hausse de taux n’implique pas forcément la baisse de toutes les actions : les bénéfices attendus et le contexte macro jouent également.","visual":"macro","scenario":"Une banque centrale relève ses taux ; une obligation ancienne à coupon fixe conserve son risque de crédit. Que prévois-tu ?","answers":["Son prix de marché est généralement sous pression","Son prix augmente automatiquement","Ses coupons sont recalculés comme un taux variable"],"correct":0,"feedback":"Le taux auquel on actualise les anciens coupons augmente, ce qui réduit leur valeur actuelle.","q2":{"scenario":"Un versement certain de 100 € dans un an est actualisé à 5 % puis à 10 %. Que devient sa valeur aujourd’hui ?","answers":["Elle passe d’environ 95,24 € à 90,91 €","Elle passe de 95,24 € à 110 €","Elle reste 100 €"],"correct":0,"feedback":"100/1,05≈95,24 € et 100/1,10≈90,91 €. Une décote plus forte réduit la valeur présente."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Taux directeurs et banque centrale ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Taux directeurs et banque centrale » en deux phrases.","a":"Les banques centrales fixent des taux clés qui influencent le financement très court et les conditions de crédit. Elles conduisent la politique monétaire pour atteindre leurs objectifs, notamment la stabilité des prix. La transmission aux ménages et entreprises dépend aussi des banques, de la concurrence et des anticipations."},{"q":"Quels mécanismes ou facteurs font varier « Taux directeurs et banque centrale » ?","a":"Une hausse des taux directeurs tend à renchérir le crédit et à freiner la demande, avec un décalage et des effets variables. Elle modifie les courbes de taux, les valorisations obligataires et les calculs de valeur actuelle des actions, sans déterminer à elle seule la direction du marché."},{"q":"Quel piège d'interprétation faut-il éviter avec « Taux directeurs et banque centrale » ?","a":"Une hausse de taux n’implique pas forcément la baisse de toutes les actions : les bénéfices attendus et le contexte macro jouent également."}],"depth":[{"label":"Le canal du crédit","text":"Les banques centrales modifient les conditions de refinancement et influencent les taux de marché, ce qui affecte le coût des prêts, les investissements et la demande. La transmission est progressive et jamais parfaitement mécanique."},{"label":"Les marchés regardent l’avenir","text":"Un taux de banque centrale est une décision à court terme ; les taux longs intègrent aussi les anticipations de décisions futures et des primes. Les deux peuvent donc bouger dans des sens différents à une annonce."},{"label":"Effets sur la valorisation","text":"Quand les taux exigés augmentent, les flux lointains sont davantage actualisés. Cela influence les obligations, les actions de croissance, les portefeuilles d’assureurs et les emprunteurs très endettés."}]},{"id":"creation","title":"Création monétaire par le crédit","group":"05 · Macroéconomie","page":"49–54, 82","chapter":9,"subtitle":"Comprendre « les crédits font les dépôts »","what":"Lorsqu’une banque commerciale accorde un crédit, elle inscrit simultanément une créance à son actif et un dépôt au passif, créant de la monnaie scripturale. Le remboursement du principal détruit cette monnaie dans le processus comptable correspondant.","how":"Cette activité n’est pas illimitée : capital réglementaire, liquidité, risque de défaut, demande solvable et refinancement contraignent les banques. Les billets et réserves de banque centrale ne sont pas identiques aux dépôts des ménages.","worked":"Un prêt de 50 000 € crédite un compte de dépôt de 50 000 € et crée une créance de 50 000 € à l’actif bancaire. Le montant emprunté n’est pas nécessairement « prélevé sur le dépôt d’un autre client » au moment de l’octroi.","trap":"Le poly comporte une formulation simplifiée et datée de la création monétaire lors des dépôts en espèces. Pour apprendre la comptabilité moderne, il faut distinguer changement de composition de la monnaie et création nette.","visual":"bank","scenario":"Une banque accorde un prêt de 100 000 € et crédite le compte de l’emprunteur. Quelle écriture correspond à l’opération ?","answers":["Actif : créance +100 000 € ; passif : dépôt +100 000 €","Actif : dépôt −100 000 € ; passif : aucun changement","Le bilan ne change pas"],"correct":0,"feedback":"La création de crédit et de dépôt modifie simultanément les deux côtés du bilan.","q2":{"scenario":"Un ménage rembourse 1 000 € de principal à sa banque avec son dépôt bancaire. Dans le bilan simplifié, que se passe-t-il ?","answers":["Prêt bancaire à l’actif et dépôt au passif diminuent chacun de 1 000 €","Ils augmentent chacun","Aucune ligne ne change"],"correct":0,"feedback":"Le remboursement du principal réduit simultanément la créance et le dépôt, toutes choses égales par ailleurs."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Création monétaire par le crédit ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Création monétaire par le crédit » en deux phrases.","a":"Lorsqu’une banque commerciale accorde un crédit, elle inscrit simultanément une créance à son actif et un dépôt au passif, créant de la monnaie scripturale. Le remboursement du principal détruit cette monnaie dans le processus comptable correspondant."},{"q":"Quels mécanismes ou facteurs font varier « Création monétaire par le crédit » ?","a":"Cette activité n’est pas illimitée : capital réglementaire, liquidité, risque de défaut, demande solvable et refinancement contraignent les banques. Les billets et réserves de banque centrale ne sont pas identiques aux dépôts des ménages."},{"q":"Quel piège d'interprétation faut-il éviter avec « Création monétaire par le crédit » ?","a":"Le poly comporte une formulation simplifiée et datée de la création monétaire lors des dépôts en espèces. Pour apprendre la comptabilité moderne, il faut distinguer changement de composition de la monnaie et création nette."}],"depth":[{"label":"Le prêt crée un dépôt","text":"Lorsqu’une banque accorde un crédit et crédite le compte de son client, elle inscrit simultanément une créance à l’actif et un dépôt au passif. Ce mécanisme est au cœur de la monnaie scripturale moderne."},{"label":"Le remboursement inverse l’écriture","text":"Le remboursement du principal réduit la créance et le dépôt : il détruit de la monnaie bancaire. À l’inverse, un simple paiement d’un client à un autre déplace de la monnaie entre comptes, sans forcément la détruire."},{"label":"Les contraintes réelles","text":"Une banque doit gérer capital réglementaire, risque de défaut, liquidité, refinancement et rentabilité. Cela empêche de conclure que le crédit peut être créé sans aucune limite économique ou prudentielle."}]},{"id":"balance","title":"Balance courante et balance des paiements","group":"05 · Macroéconomie","page":"40–47","chapter":8,"subtitle":"Comprendre qui finance l’économie d’un pays","what":"La balance des paiements est un ensemble comptable des opérations économiques entre résidents et non-résidents. Le compte courant regroupe notamment biens et services, revenus primaires et revenus secondaires. Le compte financier retrace des opérations sur actifs et passifs financiers avec l’étranger.","how":"Un déficit courant correspond, toutes choses égales par ailleurs, à un besoin de financement externe qui doit avoir une contrepartie dans les autres comptes et erreurs/omissions selon les conventions statistiques. La notation et le signe du compte financier doivent être explicités.","worked":"Un pays importe 120 Md€ de biens et services, en exporte 100 Md€, et reçoit 25 Md€ nets de revenus/transferts courants. Sa balance des biens et services est −20 Md€, mais son compte courant simplifié est +5 Md€ : un déficit commercial n’implique pas nécessairement un déficit courant.","trap":"Le poly simplifie les composantes du compte courant et emploie certaines conventions de signe particulières. Les exercices doivent annoncer les conventions plutôt que les mélanger.","visual":"macro","scenario":"Un pays a −20 Md€ d’échanges de biens et services mais +25 Md€ d’autres éléments du compte courant. Quel est le solde courant total ?","answers":["−45 Md€","+5 Md€","−20 Md€"],"correct":1,"feedback":"−20 + 25 = +5 Md€. Ne confonds pas balance commerciale et compte courant.","q2":{"scenario":"Exportations de services et biens : 100, importations : 125, autres revenus courants nets : +30. Solde courant simplifié ?","answers":["−55","+5","−25"],"correct":1,"feedback":"100−125+30=+5. Le solde courant peut être positif malgré un déficit des biens et services."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Balance courante et balance des paiements ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Balance courante et balance des paiements » en deux phrases.","a":"La balance des paiements est un ensemble comptable des opérations économiques entre résidents et non-résidents. Le compte courant regroupe notamment biens et services, revenus primaires et revenus secondaires. Le compte financier retrace des opérations sur actifs et passifs financiers avec l’étranger."},{"q":"Quels mécanismes ou facteurs font varier « Balance courante et balance des paiements » ?","a":"Un déficit courant correspond, toutes choses égales par ailleurs, à un besoin de financement externe qui doit avoir une contrepartie dans les autres comptes et erreurs/omissions selon les conventions statistiques. La notation et le signe du compte financier doivent être explicités."},{"q":"Quel piège d'interprétation faut-il éviter avec « Balance courante et balance des paiements » ?","a":"Le poly simplifie les composantes du compte courant et emploie certaines conventions de signe particulières. Les exercices doivent annoncer les conventions plutôt que les mélanger."}],"depth":[{"label":"Mesurer les liens avec le monde","text":"La balance des paiements enregistre les transactions économiques entre résidents et non-résidents. La balance courante comprend notamment les échanges de biens et services et les revenus primaires et secondaires."},{"label":"Le financement d’un déficit courant","text":"Un déficit courant correspond, en comptabilité externe, à une contrepartie dans les comptes financier/capital et les écarts statistiques, selon la convention de signes retenue. Cela n’implique pas automatiquement la faillite de l’État."},{"label":"Ne pas confondre pays et État","text":"Le déficit budgétaire de l’État ne se confond pas avec le déficit courant d’un pays. Le solde courant inclut les secteurs privés et tous les échanges avec le reste du monde."}]},{"id":"qe","title":"Assouplissement quantitatif (QE)","group":"05 · Macroéconomie","page":"82–89, 131–135","chapter":9,"subtitle":"Quand la banque centrale achète des titres","what":"Le quantitative easing désigne des achats d’actifs par une banque centrale destinés à assouplir les conditions financières, notamment lorsque les taux directeurs sont déjà très bas. Il agit sur les primes de terme, les anticipations, la liquidité et les portefeuilles des investisseurs.","how":"Un achat de titres contre de la monnaie banque centrale augmente généralement certaines réserves bancaires, mais ne garantit pas à lui seul une expansion proportionnelle du crédit ou des prix à la consommation. Son efficacité dépend du contexte.","worked":"Une banque centrale achète des obligations publiques à long terme. La demande supplémentaire peut pousser leur prix vers le haut, donc réduire leur rendement, facilitant certaines conditions de financement.","trap":"QE n’est pas synonyme de chèque envoyé à chaque ménage, ni de hausse mécanique de l’inflation.","visual":"macro","scenario":"Une banque centrale achète massivement des obligations à long terme sur le marché. À court terme, quel mécanisme est plausible ?","answers":["Pression haussière sur les prix obligataires et baissière sur certains rendements","Hausse mécanique de tous les taux longs","Suppression définitive du risque de crédit"],"correct":0,"feedback":"La demande supplémentaire peut faire augmenter les prix des obligations et réduire les rendements correspondants.","q2":{"scenario":"La banque centrale accroît les réserves via des achats d’actifs. Quel enchaînement est garanti ?","answers":["Les crédits des ménages augmentent dans la même proportion","Les prix à la consommation doublent","Aucun des deux : la transmission dépend de la demande et des banques"],"correct":2,"feedback":"L’accroissement des réserves ne se transforme pas automatiquement en nouveaux prêts ou inflation."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Assouplissement quantitatif (QE) ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Assouplissement quantitatif (QE) » en deux phrases.","a":"Le quantitative easing désigne des achats d’actifs par une banque centrale destinés à assouplir les conditions financières, notamment lorsque les taux directeurs sont déjà très bas. Il agit sur les primes de terme, les anticipations, la liquidité et les portefeuilles des investisseurs."},{"q":"Quels mécanismes ou facteurs font varier « Assouplissement quantitatif (QE) » ?","a":"Un achat de titres contre de la monnaie banque centrale augmente généralement certaines réserves bancaires, mais ne garantit pas à lui seul une expansion proportionnelle du crédit ou des prix à la consommation. Son efficacité dépend du contexte."},{"q":"Quel piège d'interprétation faut-il éviter avec « Assouplissement quantitatif (QE) » ?","a":"QE n’est pas synonyme de chèque envoyé à chaque ménage, ni de hausse mécanique de l’inflation."}],"depth":[{"label":"Un outil non conventionnel","text":"Le quantitative easing désigne des achats importants de titres, notamment obligataires, par une banque centrale. Ils augmentent la quantité de réserves bancaires et peuvent influencer les taux longs et les primes de risque."},{"label":"Les canaux de transmission","text":"La demande d’obligations peut soutenir leurs prix ; les portefeuilles se rééquilibrent, les conditions financières changent et les anticipations peuvent être affectées. L’effet dépend du contexte et des autres décisions monétaires."},{"label":"Ce que le QE n’assure pas","text":"L’augmentation des réserves n’est pas automatiquement une augmentation identique des crédits accordés aux ménages. De même, l’effet sur l’inflation n’est ni immédiat ni constant."}]},{"id":"fiscal","title":"Politique budgétaire et dette publique","group":"05 · Macroéconomie","page":"90–104, 145–159","chapter":12,"subtitle":"Dépenses, recettes et financement de l’État","what":"La politique budgétaire agit sur l’économie via les dépenses publiques, les impôts et transferts. Le déficit public est un flux annuel ; la dette publique est un stock de passifs résultant notamment de déficits passés et d’autres opérations.","how":"Une relance budgétaire peut soutenir la demande mais doit être replacée dans le cycle, les capacités de production, le niveau des taux et les conditions de financement. Dans la zone euro, les cadres budgétaires ont évolué depuis les périodes décrites dans le poly.","worked":"Une dette publique de 2 000 Md€ et un déficit annuel de 80 Md€ sont deux grandeurs différentes : l’un est un stock, l’autre un flux.","trap":"L’existence d’une dette publique élevée ne signifie pas automatiquement qu’un pays fait défaut ; la devise, les détenteurs et la structure des maturités comptent.","visual":"macro","scenario":"L’État affiche une dette de 1 800 Md€ et un déficit public de 60 Md€ cette année. Quelle proposition est correcte ?","answers":["La dette est un flux annuel et le déficit un stock","La dette est un stock, le déficit un flux","Les deux chiffres désignent nécessairement la même chose"],"correct":1,"feedback":"Le déficit mesure un besoin de financement sur une période ; la dette mesure le stock à une date.","q2":{"scenario":"Une collectivité dépense plus qu’elle ne perçoit cette année. Quelle distinction faut-il faire ?","answers":["Le déficit est un flux sur l’année, la dette un stock de financement accumulé","Déficit et dette sont exactement le même chiffre","Le déficit ne peut jamais influer sur la dette"],"correct":0,"feedback":"Le financement du déficit peut accroître la dette, mais les notions demeurent distinctes."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Politique budgétaire et dette publique ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Politique budgétaire et dette publique » en deux phrases.","a":"La politique budgétaire agit sur l’économie via les dépenses publiques, les impôts et transferts. Le déficit public est un flux annuel ; la dette publique est un stock de passifs résultant notamment de déficits passés et d’autres opérations."},{"q":"Quels mécanismes ou facteurs font varier « Politique budgétaire et dette publique » ?","a":"Une relance budgétaire peut soutenir la demande mais doit être replacée dans le cycle, les capacités de production, le niveau des taux et les conditions de financement. Dans la zone euro, les cadres budgétaires ont évolué depuis les périodes décrites dans le poly."},{"q":"Quel piège d'interprétation faut-il éviter avec « Politique budgétaire et dette publique » ?","a":"L’existence d’une dette publique élevée ne signifie pas automatiquement qu’un pays fait défaut ; la devise, les détenteurs et la structure des maturités comptent."}],"depth":[{"label":"Recettes, dépenses et solde","text":"La politique budgétaire passe par les dépenses, les prélèvements et les transferts publics. Le déficit annuel est un flux ; la dette publique est un stock accumulé, modifié par plusieurs facteurs."},{"label":"Relance et contraintes","text":"Une relance peut soutenir la demande lorsque les capacités sont sous-utilisées, mais son impact dépend de l’état de l’économie, de la politique monétaire, des fuites vers les importations et de son financement."},{"label":"Comprendre le marché obligataire","text":"Un investisseur en dette souveraine regarde la capacité fiscale, la crédibilité institutionnelle, la monnaie de financement et les conditions de marché. Le ratio dette/PIB seul ne prédit pas mécaniquement le rendement d’une obligation."}]},{"id":"topdown","title":"Approche top-down et bottom-up","group":"06 · Allocation & valorisation","page":"21–22","chapter":5,"subtitle":"Deux chemins vers une décision d’investissement","what":"L’approche top-down part de l’économie mondiale et des cycles pour choisir classes d’actifs, zones, secteurs puis titres. L’approche bottom-up commence par la valeur et les caractéristiques d’un émetteur, éventuellement indépendamment du scénario macro.","how":"Les deux approches sont compatibles. Une analyse top-down peut éviter un secteur défavorable, tandis qu’une analyse bottom-up peut identifier une entreprise sous-évaluée dans ce secteur.","worked":"Top-down : anticiper un ralentissement, réduire le poids du secteur cyclique, puis choisir les entreprises solides restantes. Bottom-up : sélectionner une entreprise grâce à ses flux de trésorerie et son avantage concurrentiel avant d’arbitrer son poids dans le portefeuille.","trap":"L’approche top-down n’est pas forcément plus quantitative ni plus juste ; elle dépend des prévisions macro, difficiles à réussir régulièrement.","visual":"portfolio","scenario":"Une analyste commence par anticiper une hausse de l’inflation, choisit des secteurs résistants puis sélectionne deux titres. Quelle approche suit-elle ?","answers":["Bottom-up","Top-down","Réplication passive pure"],"correct":1,"feedback":"Elle part du scénario macroéconomique vers la sélection de titres.","q2":{"scenario":"Un analyste sélectionne une entreprise après avoir étudié d’abord ses marges, son management et ses flux de trésorerie. Sans commencer par le cycle économique, il utilise plutôt…","answers":["Une démarche bottom-up","Une démarche top-down","Un indicateur de VaR"],"correct":0,"feedback":"L’analyse part de l’émetteur, puis replacera le titre dans le contexte du portefeuille."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Approche top-down et bottom-up ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Approche top-down et bottom-up » en deux phrases.","a":"L’approche top-down part de l’économie mondiale et des cycles pour choisir classes d’actifs, zones, secteurs puis titres. L’approche bottom-up commence par la valeur et les caractéristiques d’un émetteur, éventuellement indépendamment du scénario macro."},{"q":"Quels mécanismes ou facteurs font varier « Approche top-down et bottom-up » ?","a":"Les deux approches sont compatibles. Une analyse top-down peut éviter un secteur défavorable, tandis qu’une analyse bottom-up peut identifier une entreprise sous-évaluée dans ce secteur."},{"q":"Quel piège d'interprétation faut-il éviter avec « Approche top-down et bottom-up » ?","a":"L’approche top-down n’est pas forcément plus quantitative ni plus juste ; elle dépend des prévisions macro, difficiles à réussir régulièrement."}],"depth":[{"label":"Partir du contexte ou du titre","text":"Le top-down commence par le scénario économique et choisit ensuite régions, secteurs puis sociétés. Le bottom-up part de la qualité d’une entreprise ou du prix d’une obligation et remonte éventuellement vers le portefeuille."},{"label":"Des méthodes complémentaires","text":"Un gérant peut privilégier un secteur grâce à son scénario de taux, puis sélectionner des entreprises qui possèdent de solides cash-flows. Il n’est pas obligé d’opposer radicalement les deux approches."},{"label":"Risque de scénario","text":"Une décision top-down peut être erronée malgré une analyse cohérente si la conjoncture change ou si le marché avait déjà anticipé le scénario. Un bon processus prévoit des scénarios alternatifs et des limites de position."}]},{"id":"per","title":"PER et multiples de valorisation","group":"06 · Allocation & valorisation","page":"180–187","chapter":20,"subtitle":"Comparer prix de marché et profits","what":"Le PER (price-to-earnings ratio) rapporte le cours d’une action au bénéfice par action, ou la capitalisation au bénéfice net pertinent. Il donne un multiple du résultat, utile pour les comparaisons mais dépendant du secteur, de la croissance, de la cyclicité et de la qualité des comptes.","how":"Un PER élevé peut traduire des attentes de forte croissance, un risque perçu plus faible ou une surévaluation ; sans contexte, il ne dit pas lequel. Pour les sociétés déficitaires, le PER est souvent peu informatif. Les comparaisons exigent une cohérence des données.","worked":"Une action vaut 60 € et le bénéfice par action annuel 3 €. PER=20. Si le prix tombe à 48 € pour un bénéfice constant, PER=16, mais la baisse peut anticiper une détérioration future du bénéfice.","trap":"Une action avec PER 8 n’est pas automatiquement une bonne affaire : ses bénéfices peuvent être exceptionnels ou menacés.","visual":"equity","scenario":"Deux sociétés ont un PER de 10 et de 25. Peut-on déclarer la première sous-évaluée sans autre information ?","answers":["Oui, le plus petit PER gagne toujours","Non, il faut examiner la croissance, le risque et la qualité des bénéfices","Oui si les deux ont une action cotée"],"correct":1,"feedback":"Le multiple seul ne mesure pas la valeur intrinsèque ni le potentiel futur.","q2":{"scenario":"Une action vaut 75 € et le bénéfice par action est 5 €. Quel PER ?","answers":["15","375","0,067"],"correct":0,"feedback":"75/5=15 fois le bénéfice par action. Ce n’est pas à lui seul une preuve de sous-valorisation."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « PER et multiples de valorisation ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « PER et multiples de valorisation » en deux phrases.","a":"Le PER (price-to-earnings ratio) rapporte le cours d’une action au bénéfice par action, ou la capitalisation au bénéfice net pertinent. Il donne un multiple du résultat, utile pour les comparaisons mais dépendant du secteur, de la croissance, de la cyclicité et de la qualité des comptes."},{"q":"Quels mécanismes ou facteurs font varier « PER et multiples de valorisation » ?","a":"Un PER élevé peut traduire des attentes de forte croissance, un risque perçu plus faible ou une surévaluation ; sans contexte, il ne dit pas lequel. Pour les sociétés déficitaires, le PER est souvent peu informatif. Les comparaisons exigent une cohérence des données."},{"q":"Quel piège d'interprétation faut-il éviter avec « PER et multiples de valorisation » ?","a":"Une action avec PER 8 n’est pas automatiquement une bonne affaire : ses bénéfices peuvent être exceptionnels ou menacés."}],"depth":[{"label":"Le sens du multiple","text":"PER = prix de l’action / bénéfice par action. Il exprime combien d’unités de prix l’investisseur paie pour une unité de bénéfice annuel, sans donner une durée certaine de remboursement."},{"label":"Pourquoi un PER élevé existe","text":"Le marché peut payer davantage pour une société dont la croissance attendue est forte et les bénéfices prévisibles. À l’inverse, un PER faible peut refléter un risque d’activité ou une baisse anticipée des profits."},{"label":"Ne jamais regarder un seul chiffre","text":"Il faut examiner les bénéfices exceptionnels, la structure de dette, la génération de trésorerie, le cycle et le secteur. Un PER basé sur des profits temporairement élevés peut être trompeusement bas."}]},{"id":"dcf","title":"Valeur actualisée et DCF","group":"06 · Allocation & valorisation","page":"181–190","chapter":20,"subtitle":"Transformer des cash-flows futurs en valeur actuelle","what":"La valorisation par actualisation des flux de trésorerie (DCF) estime une valeur en ramenant les cash-flows futurs à aujourd’hui via un taux reflétant le risque. Dans une approche entreprise, on actualise souvent des flux disponibles pour les financeurs au coût moyen pondéré du capital, puis on passe à la valeur des fonds propres.","how":"Le résultat dépend fortement des hypothèses : croissance future, marges, investissements, coût du capital et valeur terminale. Il est préférable de produire des scénarios plutôt qu’une valeur faussement précise au centime.","worked":"Un flux unique de 110 € attendu dans un an vaut 100 € aujourd’hui au taux de 10 %. Si le taux exigé passe à 20 %, il ne vaut plus que 91,67 € : même flux, autre prix.","trap":"Actualiser au taux qui nous arrange n’est pas une valorisation robuste. Il faut justifier les paramètres et tester la sensibilité.","visual":"chart","scenario":"Deux entreprises ont les mêmes cash-flows futurs. Pour la première, le risque impose un taux de 7 % ; pour l’autre, 12 %. Quelle valeur actuelle est la plus élevée ?","answers":["La première, à taux de 7 %","La seconde, à taux de 12 %","Toujours identiques"],"correct":0,"feedback":"Un taux de décote plus faible augmente la valeur actuelle de flux positifs identiques.","q2":{"scenario":"Tu attends 100 € dans un an et un taux d’actualisation de 10 %. Quel est le montant actualisé ?","answers":["110 €","90,91 €","10 €"],"correct":1,"feedback":"100/1,10≈90,91 €. Si le taux augmente, la valeur baisse."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Valeur actualisée et DCF ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Valeur actualisée et DCF » en deux phrases.","a":"La valorisation par actualisation des flux de trésorerie (DCF) estime une valeur en ramenant les cash-flows futurs à aujourd’hui via un taux reflétant le risque. Dans une approche entreprise, on actualise souvent des flux disponibles pour les financeurs au coût moyen pondéré du capital, puis on passe à la valeur des fonds propres."},{"q":"Quels mécanismes ou facteurs font varier « Valeur actualisée et DCF » ?","a":"Le résultat dépend fortement des hypothèses : croissance future, marges, investissements, coût du capital et valeur terminale. Il est préférable de produire des scénarios plutôt qu’une valeur faussement précise au centime."},{"q":"Quel piège d'interprétation faut-il éviter avec « Valeur actualisée et DCF » ?","a":"Actualiser au taux qui nous arrange n’est pas une valorisation robuste. Il faut justifier les paramètres et tester la sensibilité."}],"depth":[{"label":"Valeur actuelle des flux","text":"La méthode DCF projette des cash-flows futurs puis les actualise. Une hausse du taux de décote fait baisser la valeur actuelle des flux positifs, à prévisions égales."},{"label":"Valeur entreprise et valeur des fonds propres","text":"Lorsqu’on actualise les flux disponibles pour tous les apporteurs de capitaux, on obtient une valeur d’entreprise. Pour atteindre la valeur des actionnaires, il faut ajuster de la dette financière nette et des autres éléments pertinents."},{"label":"Robustesse et scénarios","text":"La valeur terminale, la croissance et le coût du capital peuvent dominer le résultat. Construire des scénarios optimiste, central et prudent est plus honnête qu’afficher un seul prix cible très précis."}]},{"id":"stockpicking","title":"Stock picking et analyse fondamentale","group":"06 · Allocation & valorisation","page":"178–188","chapter":20,"subtitle":"Sélectionner une société, pas seulement un graphique","what":"Le stock picking consiste à choisir des titres individuels en fonction de leur qualité, de leurs perspectives et de leur prix. L’analyse fondamentale étudie le modèle économique, les bénéfices, les cash-flows, l’endettement, la gouvernance et la valorisation.","how":"Une entreprise peut être excellente mais trop chère ; une société en difficulté peut être bon marché pour de bonnes raisons. L’analyse doit distinguer qualité du business, prix payé, scénarios et risques.","worked":"Deux entreprises réalisent le même chiffre d’affaires, mais A a des marges stables et peu de dette tandis que B a des marges volatiles et des échéances proches : la différence de risque influence la valeur raisonnable.","trap":"Le cours met l’accent sur des ratios et thèmes sectoriels ; un classement purement mécanique par PER ne constitue pas une analyse complète.","visual":"equity","scenario":"Une entreprise de qualité a doublé son cours alors que ses profits stagnent. Avant d’acheter, quelle question est prioritaire ?","answers":["Les anticipations justifient-elles désormais le multiple de valorisation ?","Quel jour de la semaine est-on ?","Le nombre de lettres de son nom"],"correct":0,"feedback":"Il faut confronter prix, flux futurs et risque, plutôt que confondre bonne société et bon investissement.","q2":{"scenario":"Une action est « excellente » sur le plan opérationnel mais son prix intègre une croissance irréaliste. Quelle décision d’investissement est rationnelle ?","answers":["Acheter automatiquement parce que l’entreprise est bonne","Comparer la valeur intrinsèque estimée au prix et aux scénarios","Ignorer le prix puisqu’il ne dit rien"],"correct":1,"feedback":"Une entreprise de qualité peut être un mauvais investissement lorsqu’elle est surpayée."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Stock picking et analyse fondamentale ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Stock picking et analyse fondamentale » en deux phrases.","a":"Le stock picking consiste à choisir des titres individuels en fonction de leur qualité, de leurs perspectives et de leur prix. L’analyse fondamentale étudie le modèle économique, les bénéfices, les cash-flows, l’endettement, la gouvernance et la valorisation."},{"q":"Quels mécanismes ou facteurs font varier « Stock picking et analyse fondamentale » ?","a":"Une entreprise peut être excellente mais trop chère ; une société en difficulté peut être bon marché pour de bonnes raisons. L’analyse doit distinguer qualité du business, prix payé, scénarios et risques."},{"q":"Quel piège d'interprétation faut-il éviter avec « Stock picking et analyse fondamentale » ?","a":"Le cours met l’accent sur des ratios et thèmes sectoriels ; un classement purement mécanique par PER ne constitue pas une analyse complète."}],"depth":[{"label":"Qualité du business et prix payé","text":"Une entreprise de qualité n’est pas toujours un bon investissement au prix courant. L’analyste combine activité, avantages concurrentiels, rentabilité, financement et valorisation."},{"label":"Les documents à lire","text":"Compte de résultat, bilan, flux de trésorerie, échéances de dette et présentation des segments permettent de tester la solidité du modèle économique. Il faut aussi regarder les hypothèses de croissance et les investissements nécessaires."},{"label":"Transformer le diagnostic en décision","text":"Le prix de marché doit être comparé à une fourchette de valeur et à des scénarios. Une marge de sécurité peut aider à tenir compte de l’incertitude, sans garantir l’absence de pertes."}]},{"id":"cycles","title":"Cycle économique et allocation","group":"06 · Allocation & valorisation","page":"39, 55–66, 169–180","chapter":18,"subtitle":"Relier croissance, inflation et prix des actifs","what":"Un cycle économique traverse des phases d’accélération, ralentissement, récession et reprise, sans frontières mécaniques. Les marchés anticipent souvent les données publiées : ce sont les écarts entre surprises et attentes qui peuvent déclencher les mouvements les plus nets.","how":"Une allocation tactique peut tenter d’exprimer un scénario de croissance/inflation à travers actions, obligations, secteurs ou devises. Il faut distinguer scénario central, scénarios alternatifs et risques de mauvaise anticipation.","worked":"Si le marché attend une baisse des taux de 1 point et la banque centrale ne baisse que de 0,25 point, l’annonce peut faire remonter des rendements même si les taux ont effectivement baissé.","trap":"Une bonne nouvelle économique n’implique pas mécaniquement une hausse boursière : elle peut déjà être intégrée dans les prix.","visual":"macro","scenario":"Les investisseurs anticipent une baisse de taux de 1 %. La banque centrale annonce seulement −0,25 %. Quelle réaction de marché serait cohérente ?","answers":["Une remontée de certains rendements relativement aux attentes","La certitude d’une hausse de toutes les actions","L’absence totale de réaction"],"correct":0,"feedback":"Les prix réagissent à la surprise par rapport aux anticipations, pas seulement au signe de la décision.","q2":{"scenario":"Les résultats annoncés augmentent de 12 %, mais les investisseurs anticipaient +25 %. Quelle réaction est plausible ?","answers":["Un recul du cours malgré une hausse des bénéfices","Une hausse garantie du cours","Un dividende forcé"],"correct":0,"feedback":"Les prix réagissent aux écarts entre résultats et anticipations, en plus des résultats eux-mêmes."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Cycle économique et allocation ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Cycle économique et allocation » en deux phrases.","a":"Un cycle économique traverse des phases d’accélération, ralentissement, récession et reprise, sans frontières mécaniques. Les marchés anticipent souvent les données publiées : ce sont les écarts entre surprises et attentes qui peuvent déclencher les mouvements les plus nets."},{"q":"Quels mécanismes ou facteurs font varier « Cycle économique et allocation » ?","a":"Une allocation tactique peut tenter d’exprimer un scénario de croissance/inflation à travers actions, obligations, secteurs ou devises. Il faut distinguer scénario central, scénarios alternatifs et risques de mauvaise anticipation."},{"q":"Quel piège d'interprétation faut-il éviter avec « Cycle économique et allocation » ?","a":"Une bonne nouvelle économique n’implique pas mécaniquement une hausse boursière : elle peut déjà être intégrée dans les prix."}],"depth":[{"label":"La conjoncture n’est pas un interrupteur","text":"Croissance, inflation, emploi et crédit évoluent avec des décalages. Une économie peut ralentir sans entrer en récession, et différentes régions peuvent être à des phases différentes."},{"label":"L’allocation reflète des anticipations","text":"Les actifs se valorisent en fonction de flux futurs et de taux exigés. Une croissance publiée forte mais inférieure aux attentes peut décevoir le marché, tandis qu’une mauvaise statistique déjà anticipée peut avoir peu d’effet."},{"label":"Rendre un scénario testable","text":"Pour piloter une allocation, on peut définir des indicateurs, des probabilités de scénarios et des seuils de changement de décision. Une conviction qualitative seule ne suffit pas à évaluer sa robustesse."}]}],"chapters":[{"titre":"00 — Comment utiliser le poly de M1","html":"<p><b>Cette F0 suit le fil du poly « Gestion de portefeuille » de Xavier Barberis (191 pages)<\/b>, en le reformulant sous forme de cours, de glossaire et de tâches. Elle n’en reproduit ni les diapositives ni les graphiques, dont la diffusion est signalée interdite sur le document. Chaque chapitre possède une localisation en pages.<\/p><p><b>Fil rouge du professeur :<\/b> encadrement réglementaire → marchés → classes d’actifs → portefeuille optimal → analyse macroéconomique → allocation tactique → sélection de valeurs → timing. La partie macro est une étude de crises et d’institutions, pas seulement un catalogue de mots.<\/p><p><b>À vérifier — dimension historique.<\/b> Le poly rassemble notamment des exemples et données des années 1990–2017 : les réglementations, indices, taux directeurs et structures de marché décrits ne sont pas nécessairement encore valables. Les cas anciens sont présentés comme historiques, pas comme des informations à jour. Les pages 191 n’offrent que le titre « Analyse technique » : pas de cours technique détaillé attribué au professeur.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 1–3. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"01 — Métier et philosophies de l’investissement","html":"<p>Un gérant de portefeuille décide comment placer l’épargne d’un client en re
