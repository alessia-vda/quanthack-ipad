/* Quants Court Studio 2 · deep-navy visual system, preserving contrast and semantics */
:root{--bg:#09121e;--panel:#101c2b;--panel2:#152537;--line:#2b4054;--ink:#f4f8ff;--soft:#bdcada;--quiet:#8d9eb2;--mint:#9cf0d5;--m2:#183b39;--lav:#aaaaff;--coral:#f3b190;--blue:#83c6ee;--radius:19px;color-scheme:dark}
:root[data-theme="light"]{--bg:#f7f9fc;--panel:#fff;--panel2:#f0f4f9;--line:#dce4ec;--ink:#112238;--soft:#536b80;--quiet:#72859a;--mint:#217e6d;--m2:#e0f1ed;--lav:#5650a8;--coral:#ae6a53;--blue:#3576a1;color-scheme:light}
body{background:radial-gradient(ellipse 740px 500px at 72% -140px,rgba(35,85,126,.19),transparent 75%),var(--bg)}
.rail{background:linear-gradient(160deg,#08111b,#0d1b2a 85%);border-color:var(--line)}
:root[data-theme=light] .rail{background:#f0f4f8}
.brandmark{background:radial-gradient(circle at 80% 16%,rgba(166,175,255,.32),transparent 52%);border-radius:50%;border:1px solid rgba(167,196,247,.32);box-shadow:inset 0 0 16px rgba(140,195,241,.08)}
.railnav a.active{background:linear-gradient(95deg,rgba(107,228,202,.18),rgba(67,146,174,.07));box-shadow:inset 3px 0 0 var(--mint)}
.railnav a:hover{background:var(--panel2)}
.rail-end{display:flex;flex-direction:column;gap:10px}
.classic-side{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--mint)}
.classic-side:hover{background:var(--panel2)}
.classic-top{font-size:12px;white-space:nowrap;color:var(--soft);border:1px solid var(--line);border-radius:24px;padding:8px 12px}
.classic-top:hover{color:var(--mint);border-color:var(--mint)}
.mast{border-bottom:1px solid rgba(120,163,198,.12);padding-bottom:18px}
.eyebrow,.marker{letter-spacing:1.55px}
.home-spot{background:radial-gradient(ellipse at 85% 20%,rgba(104,75,208,.24),transparent 45%),radial-gradient(ellipse at 52% 125%,rgba(49,139,161,.18),transparent 52%),linear-gradient(122deg,#132339,#131f38 54%,#1b1937);border-color:rgba(166,187,242,.23);box-shadow:0 22px 50px rgba(0,3,12,.14)}
:root[data-theme=light] .home-spot{background:linear-gradient(120deg,#ebf1fc,#eff1ff 70%,#f8f5fa);box-shadow:0 12px 26px rgba(22,41,69,.05)}
.home-spot h2{letter-spacing:-.035em}
.home-spot .meta-visual{filter:drop-shadow(0 0 23px rgba(109,235,207,.23))}
.button{border-radius:99px;background:linear-gradient(100deg,#8fdac0,#b6fae4);color:#0b2530;box-shadow:0 4px 12px rgba(67,198,164,.08)}
:root[data-theme=light] .button{background:linear-gradient(100deg,#277e6b,#1b6b64);color:#fff}
.button.alt,.button.pale{background:var(--panel2);box-shadow:none;color:var(--ink)}
.group-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.group-card{border-color:rgba(136,168,200,.18);background:linear-gradient(150deg,#122234,#0e1828);border-radius:16px;min-height:210px;box-shadow:0 7px 22px rgba(0,4,15,.11)}
.group-card:nth-child(2){background:linear-gradient(135deg,#122139,#101c30)}
.group-card:nth-child(3){background:linear-gradient(135deg,#191e3d,#111a32)}
.group-card:nth-child(4){background:linear-gradient(135deg,#212138,#171b29)}
.group-card:nth-child(5){background:linear-gradient(135deg,#17302c,#10212a)}
.group-card:nth-child(6){background:linear-gradient(135deg,#192e3c,#131c30)}
:root[data-theme=light] .group-card,:root[data-theme=light] .group-card:nth-child(n){background:#fff;box-shadow:0 8px 21px rgba(18,39,69,.05)}
.group-graphic{background:radial-gradient(ellipse at 74% 80%,rgba(94,152,194,.22),transparent 57%);height:112px}
.group-card:nth-child(3n) .group-graphic{background:radial-gradient(ellipse at 75% 66%,rgba(157,136,234,.22),transparent 60%)}
.group-card:nth-child(3n+1) .group-graphic{background:radial-gradient(ellipse at 75% 66%,rgba(91,190,157,.2),transparent 60%)}
.notion,.lesson-pane,.overview-row,.review-stats,.flashcard{border-color:rgba(139,171,199,.2);box-shadow:0 10px 25px rgba(0,3,12,.08)}
.notion:hover,.overview-row:hover{transform:translateY(-1px);border-color:var(--mint)}
.learning-layout{gap:24px}
.lesson-pane{padding:29px 34px;background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:20px;max-width:none;min-height:450px}
:root[data-theme=light] .lesson-pane{background:#fff}
.lesson-head{border-bottom-color:rgba(139,171,199,.15)}
.lesson-head .hero-illustration{background:radial-gradient(ellipse at 60% 40%,rgba(140,174,244,.19),transparent 70%),var(--panel2)}
.step-nav button.active{background:linear-gradient(90deg,rgba(89,207,178,.2),rgba(59,147,177,.08));box-shadow:inset 2px 0 0 var(--mint)}
.flashcard{background:radial-gradient(ellipse at 50% 50%,rgba(151,136,226,.25),transparent 70%),linear-gradient(135deg,#203c53,#22243e);border:1px solid rgba(156,173,235,.4)}
:root[data-theme=light] .flashcard{background:linear-gradient(135deg,#e6eef7,#eeecfb)}
.answer.selected{background:rgba(59,140,118,.2)}
.feedback{background:rgba(101,139,180,.13)}
.callout{border-left-width:3px}
.prose{line-height:1.82}

<script>
let classicXP=0;try{classicXP=JSON.parse(localStorage.getItem('quanthack.phase1.v1')||'{}').xp||0}catch(_){};const DATA={"concepts":[{"id":"action","title":"Action","group":"01 · Instruments","page":"16, 170–186","chapter":3,"subtitle":"Une fraction du capital d’une entreprise","what":"Détenir une action signifie être propriétaire d’une fraction du capital d’une société. L’actionnaire se situe du côté des fonds propres : il supporte les variations de valeur et peut recevoir une part des bénéfices sous forme de dividendes, si ceux-ci sont décidés. Il ne possède pas une promesse contractuelle de remboursement à une échéance fixe.","how":"Deux moteurs déterminent le rendement total : la variation du cours et les dividendes perçus. La valeur réagit aux bénéfices futurs anticipés, aux taux d’actualisation, à la conjoncture et aux risques propres à l’entreprise. Lors d’une liquidation, les actionnaires sont en principe servis après les créanciers : le potentiel de gain est ouvert, mais la perte peut aller jusqu’au capital investi.","worked":"Tu achètes 8 actions à 50 €. Un an plus tard, elles valent 54 € et chaque action a versé 1,50 € de dividende. Tu as investi 400 €, tu récupères une valeur de marché de 432 € et 12 € de dividendes. Rendement brut total : (432 + 12 − 400) / 400 = 11 %, avant frais et fiscalité.","trap":"Un cours qui monte ne signifie pas automatiquement que l’entreprise devient plus rentable : les multiples de valorisation, les taux et les anticipations changent aussi. À l’inverse, un dividende n’est pas un gain gratuit : à la date ex-dividende, le prix s’ajuste généralement.","visual":"equity","scenario":"Une entreprise annonce un dividende de 4 € par action. La veille du détachement, son cours est de 100 €. Sans autre nouvelle, quelle analyse est la plus rigoureuse ?","answers":["Le portefeuille gagne automatiquement 4 € de richesse par action","Le cours peut mécaniquement s’ajuster autour de 96 €, et l’investisseur reçoit 4 € en espèces","Le dividende transforme l’action en obligation"],"correct":1,"feedback":"Le dividende transfère une partie de la valeur de la société vers la trésorerie de l’actionnaire : ce n’est pas une création mécanique de richesse.","q2":{"scenario":"Une action passe de 80 € à 84 € et verse 2 € de dividende. Quel est le rendement total brut ?","answers":["5 %","7,5 %","2,5 %"],"correct":1,"feedback":"(84 − 80 + 2) / 80 = 7,5 %. Calculer seulement la hausse du prix omet la distribution."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Action ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Action » en deux phrases.","a":"Détenir une action signifie être propriétaire d’une fraction du capital d’une société. L’actionnaire se situe du côté des fonds propres : il supporte les variations de valeur et peut recevoir une part des bénéfices sous forme de dividendes, si ceux-ci sont décidés. Il ne possède pas une promesse contractuelle de remboursement à une échéance fixe."},{"q":"Quels mécanismes ou facteurs font varier « Action » ?","a":"Deux moteurs déterminent le rendement total : la variation du cours et les dividendes perçus. La valeur réagit aux bénéfices futurs anticipés, aux taux d’actualisation, à la conjoncture et aux risques propres à l’entreprise. Lors d’une liquidation, les actionnaires sont en principe servis après les créanciers : le potentiel de gain est ouvert, mais la perte peut aller jusqu’au capital investi."},{"q":"Quel piège d'interprétation faut-il éviter avec « Action » ?","a":"Un cours qui monte ne signifie pas automatiquement que l’entreprise devient plus rentable : les multiples de valorisation, les taux et les anticipations changent aussi. À l’inverse, un dividende n’est pas un gain gratuit : à la date ex-dividende, le prix s’ajuste généralement."}],"depth":[{"label":"Propriété et priorité de paiement","text":"Le capital social n’est pas une dette remboursable à date fixe. Les actionnaires détiennent un droit résiduel : ils bénéficient de la croissance, mais absorbent en premier les pertes économiques. Leur droit de vote dépend du type d’action et des statuts."},{"label":"Comprendre le rendement","text":"Il faut additionner plus-value (ou moins-value) et distribution. Une action qui perd 3 % mais verse 5 % du cours initial en dividendes peut afficher un rendement total brut positif, avant frais et impôts. Attention aux opérations sur titres, qui nécessitent des ajustements dans les séries de prix."},{"label":"Lien avec le portefeuille","text":"Pour un gérant, une action n’est pas seulement une entreprise appréciée : c’est une exposition à un secteur, une devise, un pays et des facteurs de risque. La place de cette action dans le portefeuille dépend autant de ses corrélations que de son rendement attendu."}]},{"id":"obligation","title":"Obligation","group":"01 · Instruments","page":"16, 170–175","chapter":3,"subtitle":"Un prêt matérialisé par un titre négociable","what":"L’obligation est une créance : tu finances un État, une entreprise ou une autre entité. En contrepartie, l’émetteur promet des flux : des coupons éventuels et le remboursement d’une valeur nominale à l’échéance, sous réserve de sa capacité à payer. Tu es créancier, pas copropriétaire.","how":"Son prix en bourse est la valeur actualisée des flux futurs. À flux contractuels identiques, une hausse du rendement exigé par le marché fait baisser le prix de l’obligation existante. Le rendement exigé combine notamment le niveau des taux sans risque et une prime de risque de crédit. Attention à distinguer coupon nominal et rendement actuariel (yield to maturity).","worked":"Une obligation zéro-coupon rembourse 1 000 € dans 2 ans. Si le rendement exigé est 4 % par an, son prix théorique est 1 000/(1,04)² ≈ 924,56 €. À 5 %, il tombe à ≈ 907,03 €. Même si le remboursement promis n’a pas changé, sa valeur de marché baisse.","trap":"Une obligation n’est pas nécessairement 'sans risque'. Tu peux subir un défaut, une dégradation de crédit, une perte de liquidité ou une perte en capital si tu vends avant l’échéance.","visual":"bond","scenario":"Tu possèdes une obligation à taux fixe émise il y a deux ans. Les taux du marché augmentent fortement, sans changement du risque de défaut. Que devient son prix ?","answers":["Il tend à diminuer","Il augmente parce que ses coupons sont fixes","Il reste inchangé jusqu’à l’échéance"],"correct":0,"feedback":"De nouvelles obligations offrent de meilleurs taux. Pour que l’ancienne procure un rendement concurrentiel, son prix secondaire doit baisser.","q2":{"scenario":"Une obligation zéro-coupon rembourse 1 000 € dans un an. Le taux exigé passe de 2 % à 4 %. À quel prix approximatif est-elle valorisée après la hausse ?","answers":["1 040 €","980,39 €","961,54 €"],"correct":2,"feedback":"1 000 / 1,04 = 961,54 €. Ne pas utiliser le coupon : un zéro-coupon ne verse aucun coupon intermédiaire."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Obligation ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Obligation » en deux phrases.","a":"L’obligation est une créance : tu finances un État, une entreprise ou une autre entité. En contrepartie, l’émetteur promet des flux : des coupons éventuels et le remboursement d’une valeur nominale à l’échéance, sous réserve de sa capacité à payer. Tu es créancier, pas copropriétaire."},{"q":"Quels mécanismes ou facteurs font varier « Obligation » ?","a":"Son prix en bourse est la valeur actualisée des flux futurs. À flux contractuels identiques, une hausse du rendement exigé par le marché fait baisser le prix de l’obligation existante. Le rendement exigé combine notamment le niveau des taux sans risque et une prime de risque de crédit. Attention à distinguer coupon nominal et rendement actuariel (yield to maturity)."},{"q":"Quel piège d'interprétation faut-il éviter avec « Obligation » ?","a":"Une obligation n’est pas nécessairement 'sans risque'. Tu peux subir un défaut, une dégradation de crédit, une perte de liquidité ou une perte en capital si tu vends avant l’échéance."}],"depth":[{"label":"Flux promis et risque réellement subi","text":"Un coupon fixe de 30 € sur un nominal de 1 000 € signifie 3 % de taux facial. Mais si l’obligation s’achète 950 €, le rendement de l’investisseur n’est pas « 3 % » : le prix payé et le remboursement final modifient le rendement actuariel."},{"label":"Prix et taux : le mécanisme central","text":"L’obligation ancienne garde ses flux contractuels. Lorsque les taux exigés montent, ces flux valent moins aujourd’hui : son prix baisse. Lorsque les taux exigés diminuent, son prix monte, toutes choses égales par ailleurs."},{"label":"Risque de taux contre risque de défaut","text":"Une obligation longue à taux fixe est souvent plus sensible au mouvement de taux qu’une obligation courte. En plus, un spread de crédit peut évoluer sans que la banque centrale bouge : la rémunération du risque d’émetteur ajoute un moteur distinct."}]},{"id":"monetaire","title":"Marché monétaire","group":"01 · Instruments","page":"16, 49–54, 82–88","chapter":9,"subtitle":"L’univers du financement à court terme","what":"Le monétaire regroupe des placements et instruments de dette de courte échéance : dépôts et prêts interbancaires, titres de créance négociables de court terme ou fonds monétaires. Il sert à gérer la trésorerie et les besoins de liquidité. Il ne faut pas confondre 'monétaire' et argent liquide détenu sur un compte.","how":"Les rendements dépendent fortement des taux directeurs, des anticipations de taux courts et de la qualité de l’emprunteur. Une maturité courte limite habituellement la sensibilité aux variations de taux, mais ne supprime ni risque de crédit, ni risque de liquidité. Les fonds monétaires ont des risques et des règles propres.","worked":"Une entreprise doit placer 200 000 € pour trois mois avant de payer ses fournisseurs. Elle privilégie des instruments de trésorerie à maturité courte, plutôt qu'une action dont la valeur pourrait baisser fortement le jour du paiement. Ce choix répond à un horizon et à un besoin de liquidité.","trap":"« Monétaire » ne veut pas dire « rendement garanti en toute circonstance ». Une créance courte peut aussi connaître un défaut ou une crise de liquidité.","visual":"cash","scenario":"Un organisme doit payer une facture certaine dans six semaines. Il peut détenir des actions ou un instrument monétaire court. Quel critère doit dominer ?","answers":["Le potentiel de hausse maximal des actions","La disponibilité des fonds à l’échéance et le risque de perte","Le nombre d’émetteurs dans un indice"],"correct":1,"feedback":"L'horizon et la certitude du besoin priment sur la recherche du rendement le plus élevé.","q2":{"scenario":"Tu places 10 000 € pendant trois mois à un taux annuel simple de 4 %, sans frais. Quel intérêt approximes-tu ?","answers":["100 €","400 €","1 000 €"],"correct":0,"feedback":"10 000 × 0,04 × 3/12 = 100 €. La durée de placement est déterminante."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Marché monétaire ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Marché monétaire » en deux phrases.","a":"Le monétaire regroupe des placements et instruments de dette de courte échéance : dépôts et prêts interbancaires, titres de créance négociables de court terme ou fonds monétaires. Il sert à gérer la trésorerie et les besoins de liquidité. Il ne faut pas confondre 'monétaire' et argent liquide détenu sur un compte."},{"q":"Quels mécanismes ou facteurs font varier « Marché monétaire » ?","a":"Les rendements dépendent fortement des taux directeurs, des anticipations de taux courts et de la qualité de l’emprunteur. Une maturité courte limite habituellement la sensibilité aux variations de taux, mais ne supprime ni risque de crédit, ni risque de liquidité. Les fonds monétaires ont des risques et des règles propres."},{"q":"Quel piège d'interprétation faut-il éviter avec « Marché monétaire » ?","a":"« Monétaire » ne veut pas dire « rendement garanti en toute circonstance ». Une créance courte peut aussi connaître un défaut ou une crise de liquidité."}],"depth":[{"label":"Le rôle de la maturité","text":"Le monétaire sert surtout aux échéances courtes : sécuriser une trésorerie, financer des besoins de quelques jours ou mois et disposer de liquidités. La courte maturité réduit généralement l’exposition aux taux longs, mais n’élimine pas les risques."},{"label":"Ce que le taux rémunère","text":"Un placement monétaire ne donne pas toujours exactement le taux directeur. On observe aussi le risque de contrepartie, l’échéance, l’offre et la demande de liquidités, ainsi que les frais éventuels du véhicule."},{"label":"Choix de portefeuille","text":"On peut préférer 2,5 % relativement stable sur six semaines à un rendement attendu de 8 % sur une action si une facture certaine doit être réglée dans six semaines. Le bon actif dépend du besoin, pas uniquement du rendement maximal."}]},{"id":"derive","title":"Produit dérivé","group":"01 · Instruments","page":"16, 67–73","chapter":11,"subtitle":"Un contrat dont la valeur dépend d’un sous-jacent","what":"Un dérivé est un contrat lié à une autre variable financière : action, taux, devise, matière première, indice ou risque de crédit. On distingue notamment les forwards, futures, options et swaps. Il sert à transférer un risque, couvrir une exposition, spéculer ou construire des stratégies de prix.","how":"Un forward fixe aujourd’hui un échange futur ; une option confère un droit, et non une obligation, à son acheteur ; un swap échange des flux. Le sous-jacent et la structure du contrat déterminent les gains et pertes. L’effet de levier et le risque de contrepartie peuvent accroître les conséquences d’une erreur.","worked":"Une entreprise française recevra 1 million de dollars dans trois mois. Elle craint une baisse du dollar face à l’euro : elle peut fixer un taux de change avec un forward. Elle renonce ainsi à une éventuelle amélioration favorable du taux, mais réduit l’incertitude budgétaire.","trap":"Dérivé n’est pas synonyme de produit dangereux : une couverture peut réduire le risque. Le même instrument, utilisé pour prendre une position sans exposition initiale, peut au contraire en créer.","visual":"derivative","scenario":"Une entreprise importe du matériel payé en dollars dans six mois et craint une hausse du dollar. Elle achète une protection sur le change. Dans quel but ?","answers":["Spéculer sur la faillite du fournisseur","Stabiliser le coût en euros de son futur paiement","Devenir actionnaire du fournisseur"],"correct":1,"feedback":"La couverture vise à transformer un coût futur incertain en coût connu ou plafonné, selon l’instrument.","q2":{"scenario":"Tu possèdes un call européen de strike 110 €, échéance aujourd’hui. Le sous-jacent vaut 120 €. Quel est son payoff, hors prime ?","answers":["0 €","10 €","120 €"],"correct":1,"feedback":"Max(120 − 110,0)=10 €. Le profit net de l’acheteur dépendrait aussi de la prime initiale."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Produit dérivé ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Produit dérivé » en deux phrases.","a":"Un dérivé est un contrat lié à une autre variable financière : action, taux, devise, matière première, indice ou risque de crédit. On distingue notamment les forwards, futures, options et swaps. Il sert à transférer un risque, couvrir une exposition, spéculer ou construire des stratégies de prix."},{"q":"Quels mécanismes ou facteurs font varier « Produit dérivé » ?","a":"Un forward fixe aujourd’hui un échange futur ; une option confère un droit, et non une obligation, à son acheteur ; un swap échange des flux. Le sous-jacent et la structure du contrat déterminent les gains et pertes. L’effet de levier et le risque de contrepartie peuvent accroître les conséquences d’une erreur."},{"q":"Quel piège d'interprétation faut-il éviter avec « Produit dérivé » ?","a":"Dérivé n’est pas synonyme de produit dangereux : une couverture peut réduire le risque. Le même instrument, utilisé pour prendre une position sans exposition initiale, peut au contraire en créer."}],"depth":[{"label":"Un contrat lié à un sous-jacent","text":"Un dérivé tire sa valeur d’un autre objet financier : action, indice, taux, change ou crédit. Il permet de transférer une exposition sans acheter nécessairement directement le sous-jacent."},{"label":"Couverture, spéculation, arbitrage","text":"Une entreprise utilise un forward pour fixer un taux de change, un assureur utilise un swap pour modifier ses sensibilités de taux, et un trader peut utiliser une option pour choisir un profil de risque asymétrique. Le même instrument peut servir des finalités très différentes."},{"label":"Le risque n’est pas effacé","text":"Une couverture réduit un risque défini, mais introduit parfois d’autres contraintes : coût initial, risque de base, appels de marge et risque de contrepartie. Une position dérivée peut aussi créer un effet de levier important."}]},{"id":"opcvm","title":"Fonds d’investissement / OPCVM","group":"01 · Instruments","page":"5, 16, 29","chapter":3,"subtitle":"Investir à plusieurs dans un portefeuille collectif","what":"Un fonds d’investissement collecte des capitaux de plusieurs investisseurs pour les placer selon une stratégie et un règlement. Une part de fonds représente une fraction du patrimoine du fonds et non une action directe dans chacune des sociétés détenues.","how":"La valeur liquidative reflète la valeur du portefeuille net de certains frais. Un fonds actif peut chercher à surperformer un indice ; un fonds indiciel cherche plutôt à en suivre la performance, sous réserve des coûts et écarts de suivi. Il faut regarder les frais, l’actif réel, la liquidité et le risque.","worked":"Un fonds composé de 60 % d’actions et 40 % d’obligations ne se comporte pas comme un fonds composé uniquement d’actions : c’est l’allocation sous-jacente qui compte, pas l’étiquette « fonds ».","trap":"Diversifié ne signifie pas immunisé contre une baisse générale des marchés. Les frais cumulés influencent le rendement net.","visual":"fund","scenario":"Un fonds annonce +6 % et son indice de référence +8 % sur la même période. Sans autre précision, quelle conclusion est correcte ?","answers":["Le fonds a surperformé de 2 points","Le fonds a sous-performé de 2 points, mais on doit examiner son risque et son mandat","Le gestionnaire a nécessairement commis une faute"],"correct":1,"feedback":"L’écart brut est −2 points. Pour juger la gestion, il faut aussi comparer risques, frais, horizon et contraintes.","q2":{"scenario":"Un fonds non levier détient 60 % d’actions et 40 % d’obligations. Les actions font −10 % et les obligations +5 %. Rendement approximatif avant frais ?","answers":["−4 %","−7 %","+5 %"],"correct":0,"feedback":"0,6×(−10 %)+0,4×5 %=−4 %, à pondérations initiales et sans rebalancement intermédiaire."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Fonds d’investissement / OPCVM ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Fonds d’investissement / OPCVM » en deux phrases.","a":"Un fonds d’investissement collecte des capitaux de plusieurs investisseurs pour les placer selon une stratégie et un règlement. Une part de fonds représente une fraction du patrimoine du fonds et non une action directe dans chacune des sociétés détenues."},{"q":"Quels mécanismes ou facteurs font varier « Fonds d’investissement / OPCVM » ?","a":"La valeur liquidative reflète la valeur du portefeuille net de certains frais. Un fonds actif peut chercher à surperformer un indice ; un fonds indiciel cherche plutôt à en suivre la performance, sous réserve des coûts et écarts de suivi. Il faut regarder les frais, l’actif réel, la liquidité et le risque."},{"q":"Quel piège d'interprétation faut-il éviter avec « Fonds d’investissement / OPCVM » ?","a":"Diversifié ne signifie pas immunisé contre une baisse générale des marchés. Les frais cumulés influencent le rendement net."}],"depth":[{"label":"Ce qu’on détient vraiment","text":"L’investisseur achète des parts d’un fonds et détient indirectement un portefeuille géré selon des règles. La valeur liquidative reflète la valeur des actifs nets divisée par le nombre de parts."},{"label":"Gestion et frais","text":"La performance dépend des choix d’investissement mais aussi des frais, parfois récurrents. Il faut lire stratégie, horizon, liquidité, risque, benchmark et méthode de valorisation."},{"label":"Fonds et diversification","text":"Un fonds peut être diversifié ou très spécialisé. Il ne faut pas confondre mutualisation des titres et absence de risque de marché."}]},{"id":"etf","title":"ETF / tracker","group":"01 · Instruments","page":"4–5, 12","chapter":3,"subtitle":"Un fonds généralement négocié en Bourse","what":"Un ETF est un fonds coté qui peut suivre un indice, une stratégie ou un panier d’actifs. Son prix se négocie en séance, alors que sa valeur liquidative indicative reflète les actifs sous-jacents. Beaucoup d’ETF sont indiciels, mais pas tous.","how":"La réplication peut être physique ou synthétique ; elle implique des risques différents. Les frais, le spread de négociation, l’écart de suivi et l’exposition réelle sont des critères importants. Un ETF mondial d’actions n’est pas « sans risque » : il porte les variations des marchés actions.","worked":"Tu souhaites t’exposer aux actions européennes sans sélectionner trente titres. Un ETF sur un indice large peut offrir cette exposition en une seule transaction, avec des frais à surveiller.","trap":"ETF et indice ne sont pas la même chose. L’indice est une règle de calcul ; l’ETF est un produit financier qui tente de reproduire une stratégie.","visual":"fund","scenario":"Un ETF suit l’indice A avec un rendement de +9,5 % alors que l’indice fait +10 %. Que regarder en premier ?","answers":["L’écart de suivi et les frais","Le coupon obligataire de l’ETF","Le nombre d’actions de l’investisseur"],"correct":0,"feedback":"Un ETF est un instrument à analyser avec ses frais, sa méthode de réplication et sa tracking difference.","q2":{"scenario":"Tu conserves pendant un an 20 000 € dans un ETF dont les frais de gestion sont approximativement 0,25 % par an. Quel ordre de grandeur représentent-ils ?","answers":["5 €","50 €","500 €"],"correct":1,"feedback":"20 000 × 0,0025 = 50 €. C’est une approximation avant variations de valeur et autres frais."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « ETF / tracker ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « ETF / tracker » en deux phrases.","a":"Un ETF est un fonds coté qui peut suivre un indice, une stratégie ou un panier d’actifs. Son prix se négocie en séance, alors que sa valeur liquidative indicative reflète les actifs sous-jacents. Beaucoup d’ETF sont indiciels, mais pas tous."},{"q":"Quels mécanismes ou facteurs font varier « ETF / tracker » ?","a":"La réplication peut être physique ou synthétique ; elle implique des risques différents. Les frais, le spread de négociation, l’écart de suivi et l’exposition réelle sont des critères importants. Un ETF mondial d’actions n’est pas « sans risque » : il porte les variations des marchés actions."},{"q":"Quel piège d'interprétation faut-il éviter avec « ETF / tracker » ?","a":"ETF et indice ne sont pas la même chose. L’indice est une règle de calcul ; l’ETF est un produit financier qui tente de reproduire une stratégie."}],"depth":[{"label":"Suivre un indice","text":"Un ETF est généralement un fonds indiciel négocié en bourse. Sa construction peut reposer sur une réplication physique ou synthétique ; il faut comprendre l’indice suivi et les risques du montage."},{"label":"Prix de marché contre valeur du panier","text":"Le cours coté peut momentanément différer de la valeur estimée des actifs sous-jacents. Les mécanismes de création/rachat de parts tendent à limiter ces écarts, sans les rendre impossibles."},{"label":"Une enveloppe, pas une stratégie","text":"Un ETF thématique concentré peut être plus risqué qu’un fonds traditionnel très diversifié. Examiner la composition, les frais et le change reste indispensable."}]},{"id":"devises","title":"Devises et taux de change","group":"01 · Instruments","page":"22, 40–45, 140–143","chapter":8,"subtitle":"Le prix relatif de deux monnaies","what":"Une paire de change exprime combien d’unités d’une devise s’échangent contre une autre. Par exemple EUR/USD = 1,10 signifie 1 € = 1,10 $. Une hausse de cette cotation signifie que l’euro se renforce face au dollar.","how":"Les entreprises et investisseurs internationaux font face au risque de change. Un rendement positif dans une devise peut être annulé par sa dépréciation contre la devise de référence du portefeuille. Les forwards et options de change permettent d’en réduire certaines composantes.","worked":"Tu investis 1 000 € lorsque EUR/USD = 1. À la fin, les actions américaines valent 1 100 $, mais EUR/USD vaut 1,20 : leur contrevaleur n’est plus que 916,67 €. Le rendement en dollars est +10 %, celui en euros environ −8,33 %.","trap":"Une hausse du dollar ne signifie pas une hausse de EUR/USD : c’est l’inverse puisque le dollar est au dénominateur.","visual":"fx","scenario":"Une action américaine est stable en dollars, mais le dollar perd 10 % face à l’euro. Pour un investisseur français non couvert, le rendement en euros sera plutôt…","answers":["Négatif","Nul","Positif de 10 %"],"correct":0,"feedback":"L’effet de change modifie la contrevaleur de l’actif. Il faut toujours préciser la devise de mesure.","q2":{"scenario":"Tu encaisses 1 100 dollars alors que EUR/USD=1,10. Quelle est leur contrevaleur ?","answers":["1 000 €","1 210 €","1 100 €"],"correct":0,"feedback":"1 € = 1,10 $, donc euros = dollars / 1,10 = 1 000 €."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Devises et taux de change ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Devises et taux de change » en deux phrases.","a":"Une paire de change exprime combien d’unités d’une devise s’échangent contre une autre. Par exemple EUR/USD = 1,10 signifie 1 € = 1,10 $. Une hausse de cette cotation signifie que l’euro se renforce face au dollar."},{"q":"Quels mécanismes ou facteurs font varier « Devises et taux de change » ?","a":"Les entreprises et investisseurs internationaux font face au risque de change. Un rendement positif dans une devise peut être annulé par sa dépréciation contre la devise de référence du portefeuille. Les forwards et options de change permettent d’en réduire certaines composantes."},{"q":"Quel piège d'interprétation faut-il éviter avec « Devises et taux de change » ?","a":"Une hausse du dollar ne signifie pas une hausse de EUR/USD : c’est l’inverse puisque le dollar est au dénominateur."}],"depth":[{"label":"Une conversion de valeur","text":"Un prix en devise étrangère ne suffit pas à déterminer le résultat pour un investisseur français. Il faut convertir l’achat initial et la valeur finale, y compris les flux intermédiaires."},{"label":"Le sens du taux de change","text":"Si EUR/USD passe de 1,10 à 1,20, un euro achète davantage de dollars. Le dollar s’affaiblit contre l’euro ; un actif identique en USD vaut donc moins en EUR, toutes choses égales."},{"label":"Couvrir ou garder l’exposition","text":"Un gérant peut couvrir ce risque par un contrat à terme, mais il renonce alors généralement au gain de change inverse et supporte un coût ou un différentiel de taux."}]},{"id":"primaire","title":"Marché primaire et secondaire","group":"02 · Marchés & acteurs","page":"10–14","chapter":2,"subtitle":"Émettre un titre n’est pas le revendre","what":"Sur le marché primaire, un titre est créé et placé auprès des investisseurs : l’émetteur peut recevoir des fonds. Sur le secondaire, des titres déjà émis changent de mains entre investisseurs. Les deux marchés jouent des rôles complémentaires.","how":"Un marché secondaire liquide facilite le financement primaire : un investisseur accepte plus volontiers de souscrire un titre s’il pourra le revendre. En revanche, chaque achat secondaire n’apporte pas directement de capital nouveau à l’entreprise.","worked":"Une société émet 10 millions d’actions nouvelles : c’est une opération primaire. Trois mois après, tu achètes 5 actions de cette société à un autre investisseur : c’est une opération secondaire.","trap":"Acheter une action en Bourse ne revient pas en général à verser directement l’argent de cet achat à l’entreprise.","visual":"market","scenario":"Tu achètes pour 2 000 € d’actions déjà cotées à un autre investisseur. Qui reçoit directement les 2 000 € ?","answers":["L’entreprise émettrice","Le vendeur de tes actions","L’autorité des marchés"],"correct":1,"feedback":"La transaction est secondaire : l’argent va au vendeur, hors frais de transaction.","q2":{"scenario":"Une société émet 100 000 actions nouvelles à 20 € l’unité. Quel montant brut l’opération lui apporte-t-elle, avant frais ?","answers":["0 €, car les actions sont toujours secondaires","2 millions €","100 000 €"],"correct":1,"feedback":"100 000×20=2 M€ de produit brut d’émission. C’est bien un financement primaire."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Marché primaire et secondaire ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Marché primaire et secondaire » en deux phrases.","a":"Sur le marché primaire, un titre est créé et placé auprès des investisseurs : l’émetteur peut recevoir des fonds. Sur le secondaire, des titres déjà émis changent de mains entre investisseurs. Les deux marchés jouent des rôles complémentaires."},{"q":"Quels mécanismes ou facteurs font varier « Marché primaire et secondaire » ?","a":"Un marché secondaire liquide facilite le financement primaire : un investisseur accepte plus volontiers de souscrire un titre s’il pourra le revendre. En revanche, chaque achat secondaire n’apporte pas directement de capital nouveau à l’entreprise."},{"q":"Quel piège d'interprétation faut-il éviter avec « Marché primaire et secondaire » ?","a":"Acheter une action en Bourse ne revient pas en général à verser directement l’argent de cet achat à l’entreprise."}],"depth":[{"label":"Qui reçoit les fonds ?","text":"Sur un marché primaire, un titre est nouvellement émis. Un acheteur d’obligation d’État au moment de son émission finance l’État ; un souscripteur à une augmentation de capital finance la société. Les intermédiaires placent les titres mais le financement est destiné à l’émetteur."},{"label":"La vie après l’émission","text":"Sur le secondaire, les titres circulent entre investisseurs. Une action revendue ne rapporte pas un nouvel apport à la société elle-même, mais le marché secondaire contribue à la liquidité et à l’attractivité des émissions primaires."},{"label":"Lecture économique","text":"Une société très suivie mais dont les titres sont difficiles à revendre peut payer davantage pour lever des capitaux. Liquidité secondaire et coût de financement primaire sont donc liés, même si ce sont deux marchés distincts."}]},{"id":"carnet","title":"Carnet d’ordres et liquidité","group":"02 · Marchés & acteurs","page":"12–14","chapter":2,"subtitle":"Comment un prix se forme réellement","what":"Le carnet rassemble des intentions d’achat (bid) et de vente (ask) à différents prix et quantités. Le meilleur bid est le prix d’achat le plus élevé ; le meilleur ask est le prix de vente le plus bas. Leur différence est le spread affiché.","how":"Un ordre au marché cherche l’exécution immédiate mais ne garantit pas son prix ; un ordre à cours limité maîtrise le prix maximal/minimal mais peut ne pas être exécuté. La profondeur du carnet et l’activité des intervenants influencent l’impact d’un ordre important.","worked":"Meilleur bid : 99,80 € pour 100 titres ; meilleur ask : 100 € pour 20 titres, puis 100,40 € pour 200 titres. Si tu achètes 50 titres au marché, tu peux obtenir 20 à 100 € et 30 à 100,40 € : prix moyen = 100,24 €, avant frais.","trap":"Ne confonds pas spread affiché et coût total d’exécution : un gros ordre peut consommer plusieurs niveaux de prix.","visual":"order","scenario":"Sur un carnet, seul 10 titres sont proposés à 50 €, puis 200 à 51 €. Tu achètes 100 titres au marché. Quel risque principal ?","answers":["Aucun : le dernier prix protège toujours","L’exécution traverse le carnet et le prix moyen dépasse 50 €","L’ordre au marché se transforme en dividende"],"correct":1,"feedback":"Le glissement (« slippage ») apparaît quand la quantité au meilleur prix est insuffisante.","q2":{"scenario":"Meilleur bid 99,80 €, meilleur ask 100,10 €. Quel est le spread affiché ?","answers":["0,30 €","0,15 €","1,30 €"],"correct":0,"feedback":"Spread = ask − bid = 100,10−99,80 = 0,30 € par titre."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Carnet d’ordres et liquidité ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Carnet d’ordres et liquidité » en deux phrases.","a":"Le carnet rassemble des intentions d’achat (bid) et de vente (ask) à différents prix et quantités. Le meilleur bid est le prix d’achat le plus élevé ; le meilleur ask est le prix de vente le plus bas. Leur différence est le spread affiché."},{"q":"Quels mécanismes ou facteurs font varier « Carnet d’ordres et liquidité » ?","a":"Un ordre au marché cherche l’exécution immédiate mais ne garantit pas son prix ; un ordre à cours limité maîtrise le prix maximal/minimal mais peut ne pas être exécuté. La profondeur du carnet et l’activité des intervenants influencent l’impact d’un ordre important."},{"q":"Quel piège d'interprétation faut-il éviter avec « Carnet d’ordres et liquidité » ?","a":"Ne confonds pas spread affiché et coût total d’exécution : un gros ordre peut consommer plusieurs niveaux de prix."}],"depth":[{"label":"Deux côtés du marché","text":"Le bid est le meilleur prix proposé par un acheteur ; l’ask celui exigé par un vendeur. Le spread bid–ask rémunère en partie l’intermédiation et signale aussi des frictions. Il est généralement plus faible lorsque la liquidité est élevée."},{"label":"Type d’ordre et exécution","text":"Un ordre au marché privilégie la rapidité, mais peut être exécuté à plusieurs niveaux si le volume dépasse la quantité disponible. Un ordre limite contrôle le prix maximal d’achat ou minimal de vente, au risque de ne pas s’exécuter."},{"label":"Lien avec Optiver","text":"À la clôture, une enchère centralise une partie des ordres afin de déterminer un prix d’équilibre. Prévoir le mouvement du prix de clôture nécessite de regarder l’imbalance, la profondeur, les ordres et le timing, pas seulement le dernier prix."}]},{"id":"acteurs","title":"Gérant, teneur de marché, régulateur","group":"02 · Marchés & acteurs","page":"4–12","chapter":1,"subtitle":"Des métiers qui ne prennent pas les mêmes décisions","what":"Le gérant choisit les expositions d’un portefeuille dans le cadre d’un mandat. Le teneur de marché propose des prix d’achat et de vente et fournit de la liquidité, tout en portant un risque d’inventaire. Le régulateur surveille le respect des règles et la protection des investisseurs.","how":"Le front office prend et couvre des positions selon le métier, le middle office contribue aux contrôles et au suivi des risques, et le back office gère notamment la confirmation et le règlement-livraison. Ces frontières varient suivant les établissements.","worked":"Un client souhaite réduire le risque obligataire de son mandat : le gérant réalloue les positions ; le desk fournit un prix d’exécution ; les fonctions de contrôle vérifient les limites.","trap":"Tous les métiers « en banque » ne consistent pas à prévoir les cours des actions.","visual":"market","scenario":"Une banque propose en permanence un prix auquel elle achète et un prix auquel elle vend une obligation. Elle agit ici surtout comme…","answers":["Teneur de marché","Autorité de supervision","Auditeur comptable"],"correct":0,"feedback":"Le market maker offre des cotations bid/ask et supporte le risque de tenir des positions.","q2":{"scenario":"Une position de trading dépasse une limite interne de marché. Qui doit notamment identifier et contrôler ce dépassement ?","answers":["Un dispositif indépendant de contrôle des risques","Le seul client particulier","Uniquement l’émetteur de la devise"],"correct":0,"feedback":"Le suivi indépendant des risques et des limites fait partie du dispositif de contrôle, même si le front office suit aussi ses positions."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Gérant, teneur de marché, régulateur ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Gérant, teneur de marché, régulateur » en deux phrases.","a":"Le gérant choisit les expositions d’un portefeuille dans le cadre d’un mandat. Le teneur de marché propose des prix d’achat et de vente et fournit de la liquidité, tout en portant un risque d’inventaire. Le régulateur surveille le respect des règles et la protection des investisseurs."},{"q":"Quels mécanismes ou facteurs font varier « Gérant, teneur de marché, régulateur » ?","a":"Le front office prend et couvre des positions selon le métier, le middle office contribue aux contrôles et au suivi des risques, et le back office gère notamment la confirmation et le règlement-livraison. Ces frontières varient suivant les établissements."},{"q":"Quel piège d'interprétation faut-il éviter avec « Gérant, teneur de marché, régulateur » ?","a":"Tous les métiers « en banque » ne consistent pas à prévoir les cours des actions."}],"depth":[{"label":"Des incitations distinctes","text":"Le gérant investit dans le cadre du mandat de son client. Le teneur de marché affiche des prix et porte un risque d’inventaire. Le courtier exécute des transactions selon un mandat et des règles de meilleure exécution."},{"label":"Contrôle et supervision","text":"Des régulateurs et des fonctions de conformité surveillent les obligations d’information, les abus de marché et la protection des investisseurs. Ces responsabilités ne se confondent pas avec les fonctions de trading."},{"label":"Exemple opérationnel","text":"Un gérant souhaite vendre une action illiquide ; le trader ou courtier choisit une méthode d’exécution ; le market maker peut être contrepartie. Le risque de mauvaise exécution concerne donc plusieurs acteurs, chacun avec une responsabilité différente."}]},{"id":"benchmark","title":"Benchmark / indice de référence","group":"02 · Marchés & acteurs","page":"5, 16, 21–29","chapter":3,"subtitle":"La base d’une comparaison honnête","what":"Le benchmark est le portefeuille ou l’indice de référence choisi pour évaluer une stratégie. Il doit refléter les opportunités et risques effectivement autorisés au gérant. Un benchmark diversifié peut combiner plusieurs classes d’actifs.","how":"Comparer uniquement le rendement absolu peut être trompeur : +4 % peut être décevant si la référence a fait +9 %, mais bon si elle a perdu 10 %. On examine la performance relative, le risque pris et l’horizon. Le benchmark n’est pas toujours immuable : sa méthodologie doit être documentée.","worked":"Ton portefeuille fait +7 % tandis que son benchmark fait +5 %. Surperformance arithmétique : +2 points de pourcentage, sans présumer que cet excès s’explique par une compétence stable.","trap":"Un benchmark mal choisi peut faire paraître une stratégie excellente ou médiocre sans changer ses résultats réels.","visual":"index","scenario":"Un fonds obligataire est comparé uniquement au CAC 40. Pourquoi ce choix pose-t-il un problème ?","answers":["Il est interdit de calculer une différence","Les expositions et risques comparés ne sont pas représentatifs","Tous les benchmarks doivent être américains"],"correct":1,"feedback":"La référence doit correspondre au mandat et au profil de risque du portefeuille.","q2":{"scenario":"Portefeuille +3 %, benchmark −1 % sur la même période. Quelle surperformance arithmétique ?","answers":["−4 points","+2 points","+4 points"],"correct":2,"feedback":"+3 − (−1) = +4 points de pourcentage. La qualité de gestion exige aussi une analyse du risque."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Benchmark / indice de référence ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Benchmark / indice de référence » en deux phrases.","a":"Le benchmark est le portefeuille ou l’indice de référence choisi pour évaluer une stratégie. Il doit refléter les opportunités et risques effectivement autorisés au gérant. Un benchmark diversifié peut combiner plusieurs classes d’actifs."},{"q":"Quels mécanismes ou facteurs font varier « Benchmark / indice de référence » ?","a":"Comparer uniquement le rendement absolu peut être trompeur : +4 % peut être décevant si la référence a fait +9 %, mais bon si elle a perdu 10 %. On examine la performance relative, le risque pris et l’horizon. Le benchmark n’est pas toujours immuable : sa méthodologie doit être documentée."},{"q":"Quel piège d'interprétation faut-il éviter avec « Benchmark / indice de référence » ?","a":"Un benchmark mal choisi peut faire paraître une stratégie excellente ou médiocre sans changer ses résultats réels."}],"depth":[{"label":"Le bon point de comparaison","text":"Un indice de référence doit correspondre à l’univers et au risque de la stratégie. Comparer un fonds obligataire de courte durée à un indice d’actions ne permet pas d’évaluer correctement la compétence du gérant."},{"label":"Poids et performance relative","text":"La performance active vient des écarts de poids, de sélection et de timing par rapport au benchmark. Un portefeuille peut gagner de l’argent et pourtant sous-performer son indice : les deux jugements sont compatibles."},{"label":"Attention au choix a posteriori","text":"Changer d’indice après avoir vu les performances déforme l’évaluation. Une gestion sérieuse définit la référence et les contraintes avant la période analysée."}]},{"id":"active","title":"Gestion active et gestion passive","group":"02 · Marchés & acteurs","page":"4–5, 20–22","chapter":1,"subtitle":"Deux façons différentes de décider","what":"Une gestion passive cherche à suivre une stratégie ou un indice prédéfini, alors qu’une gestion active prend volontairement des positions pour surperformer un objectif. L’efficience informationnelle des marchés est l’une des idées qui nourrissent ce débat.","how":"La gestion active implique des coûts d’analyse et de transaction et ne garantit pas la surperformance. Une stratégie passive supporte elle aussi des coûts, un écart de suivi et parfois des risques de construction de l’indice. Aucune n’est universellement supérieure.","worked":"Deux fonds suivent les actions françaises : l’un reproduit mécaniquement un indice, l’autre surpondère la santé et sous-pondère les banques. Le second assume un risque actif de déviation par rapport au benchmark.","trap":"« Passif » ne signifie pas « sans risque » ; le risque de marché reste présent.","visual":"index","scenario":"Un gérant sous-pondère volontairement les valeurs industrielles pour anticiper un ralentissement. Quel risque accepte-t-il ?","answers":["Un risque actif de sous-performer son benchmark","L’absence totale de volatilité","La certitude de battre son indice"],"correct":0,"feedback":"La gestion active parie sur une différence avec la référence et peut perdre ce pari.","q2":{"scenario":"Une stratégie active réalise +6 % alors que son benchmark affiche +8 %, avant frais. Quelle conclusion chiffrée ?","answers":["Sous-performance relative de 2 points","Surperformance relative de 2 points","Performance relative nulle"],"correct":0,"feedback":"6 − 8 = −2 points. Une stratégie active peut avoir un rendement positif tout en sous-performant."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Gestion active et gestion passive ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Gestion active et gestion passive » en deux phrases.","a":"Une gestion passive cherche à suivre une stratégie ou un indice prédéfini, alors qu’une gestion active prend volontairement des positions pour surperformer un objectif. L’efficience informationnelle des marchés est l’une des idées qui nourrissent ce débat."},{"q":"Quels mécanismes ou facteurs font varier « Gestion active et gestion passive » ?","a":"La gestion active implique des coûts d’analyse et de transaction et ne garantit pas la surperformance. Une stratégie passive supporte elle aussi des coûts, un écart de suivi et parfois des risques de construction de l’indice. Aucune n’est universellement supérieure."},{"q":"Quel piège d'interprétation faut-il éviter avec « Gestion active et gestion passive » ?","a":"« Passif » ne signifie pas « sans risque » ; le risque de marché reste présent."}],"depth":[{"label":"Une promesse de méthode, pas de résultat","text":"En gestion passive, on recherche une exposition proche d’un indice ; en gestion active, on fait des paris relatifs pour espérer créer une surperformance. Ces paris peuvent venir des secteurs, titres, zones géographiques ou du niveau de liquidités."},{"label":"Ce qu’il faut mesurer","text":"Une surperformance affichée avant frais ne prouve pas une création de valeur pour l’investisseur. Il faut contrôler la volatilité, la tracking error, les périodes de baisse et les frais réellement supportés."},{"label":"Quand l’analyse est trompeuse","text":"Un gérant qui a obtenu une année remarquable grâce à une forte exposition technologique peut avoir surtout bénéficié d’un facteur commun. L’attribution de performance et les comparaisons pluriannuelles sont essentielles."}]},{"id":"diversification","title":"Diversification et corrélation","group":"03 · Portefeuille & performance","page":"16–19","chapter":3,"subtitle":"Ne pas mettre tous ses risques au même endroit","what":"Diversifier consiste à combiner des actifs dont les rendements ne fluctuent pas exactement ensemble. La corrélation joue un rôle déterminant : une combinaison d’actifs peu corrélés peut réduire la volatilité du portefeuille sans nécessairement sacrifier autant de rendement espéré.","how":"La diversification atténue surtout le risque spécifique des entreprises. Elle ne supprime pas le risque commun de marché, surtout quand les corrélations augmentent pendant les crises. Le professeur illustre cette diminution puis un plancher de risque dans son graphique des pages 18–19.","worked":"Deux actifs de volatilité identique de 20 %, chacun pondéré à 50 %. Si leur corrélation est 1, volatilité = 20 %. Si leur corrélation est 0, volatilité ≈ 14,14 %. Si elle vaut −1 et que les volatilités sont identiques, la volatilité théorique devient 0.","trap":"Le poly évoque un seuil de 25 titres : ce n’est pas une loi universelle. La diversité des facteurs de risque importe plus que le seul nombre de lignes.","visual":"portfolio","scenario":"Deux entreprises pétrolières présentent une corrélation de rendement de 0,95. En ajouter une seconde à ton portefeuille réduit-il sûrement beaucoup le risque ?","answers":["Oui, puisqu’il y a deux lignes","Pas nécessairement : elles restent exposées aux mêmes facteurs","Oui, la corrélation n’importe jamais"],"correct":1,"feedback":"La réduction de risque dépend des co-mouvements et des expositions communes.","q2":{"scenario":"Deux actifs ont la même volatilité et une corrélation de −1. À poids égaux, leur combinaison peut-elle théoriquement annuler la volatilité ?","answers":["Oui, sous ces hypothèses exactes","Non, c’est mathématiquement impossible","Oui seulement si les actions sont du même secteur"],"correct":0,"feedback":"Les fluctuations opposées se compensent exactement pour des expositions appropriées. C’est une idéalisation rare en pratique."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Diversification et corrélation ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Diversification et corrélation » en deux phrases.","a":"Diversifier consiste à combiner des actifs dont les rendements ne fluctuent pas exactement ensemble. La corrélation joue un rôle déterminant : une combinaison d’actifs peu corrélés peut réduire la volatilité du portefeuille sans nécessairement sacrifier autant de rendement espéré."},{"q":"Quels mécanismes ou facteurs font varier « Diversification et corrélation » ?","a":"La diversification atténue surtout le risque spécifique des entreprises. Elle ne supprime pas le risque commun de marché, surtout quand les corrélations augmentent pendant les crises. Le professeur illustre cette diminution puis un plancher de risque dans son graphique des pages 18–19."},{"q":"Quel piège d'interprétation faut-il éviter avec « Diversification et corrélation » ?","a":"Le poly évoque un seuil de 25 titres : ce n’est pas une loi universelle. La diversité des facteurs de risque importe plus que le seul nombre de lignes."}],"depth":[{"label":"Pourquoi le nombre de lignes ne suffit pas","text":"Quarante actions du même secteur peuvent réagir de manière semblable à un choc commun. La réduction du risque dépend de la covariance, pas seulement du nombre de titres dans le compte."},{"label":"Un mécanisme mathématique","text":"Pour deux actifs, Var(w₁R₁+w₂R₂)=w₁²σ₁²+w₂²σ₂²+2w₁w₂Cov(R₁,R₂). Le terme de covariance explique pourquoi la volatilité du mélange peut être inférieure à la moyenne des volatilités individuelles."},{"label":"La limite : le risque de marché","text":"Les chocs affectant l’ensemble du marché restent difficiles à éliminer par simple diversification. Les corrélations peuvent également augmenter en crise, précisément quand on souhaiterait une protection."}]},{"id":"markowitz","title":"Portefeuille optimal / Markowitz","group":"03 · Portefeuille & performance","page":"20, 25–27","chapter":4,"subtitle":"Choisir des poids, pas seulement de bons titres","what":"Le modèle moyenne-variance de Markowitz décrit le rendement espéré d’un portefeuille comme une moyenne pondérée des rendements individuels, et son risque via toute la matrice de covariance. On cherche des portefeuilles qui minimisent la variance pour un rendement espéré donné, ou maximisent le rendement pour un niveau de risque fixé.","how":"La frontière efficiente rassemble les meilleurs compromis rendement-risque compte tenu des hypothèses. En pratique, les estimations de rendements espérés et covariances sont incertaines ; des contraintes de poids, de concentration, de frais ou de liquidité sont essentielles.","worked":"Un portefeuille 50/50 de deux actifs A et B ne connaît pas son risque simplement en moyennant les deux volatilités : il faut le terme 2w_Aw_BCov(A,B). C’est justement le cœur de l’optimisation.","trap":"Le portefeuille optimal du modèle n’est pas « le meilleur portefeuille du monde » : il dépend des hypothèses et de l’aversion au risque de l’investisseur.","visual":"portfolio","scenario":"Deux portefeuilles visent exactement 6 % de rendement attendu, mais l’un a une volatilité de 9 % et l’autre de 13 %, sans autre différence. Lequel est dominé dans l’espace moyenne-variance ?","answers":["Celui à 9 %","Celui à 13 %","Aucun, car les rendements sont égaux"],"correct":1,"feedback":"À rendement espéré égal, une variance plus élevée est inefficiente, toutes choses égales par ailleurs.","q2":{"scenario":"Un portefeuille a 70 % d’un actif au rendement espéré 8 % et 30 % d’un actif à 2 %. Rendement espéré du portefeuille ?","answers":["5 %","6,2 %","10 %"],"correct":1,"feedback":"0,7×8 % + 0,3×2 %=6,2 %. Le rendement moyen se pondère ; la variance demande aussi les covariances."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Portefeuille optimal / Markowitz ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Portefeuille optimal / Markowitz » en deux phrases.","a":"Le modèle moyenne-variance de Markowitz décrit le rendement espéré d’un portefeuille comme une moyenne pondérée des rendements individuels, et son risque via toute la matrice de covariance. On cherche des portefeuilles qui minimisent la variance pour un rendement espéré donné, ou maximisent le rendement pour un niveau de risque fixé."},{"q":"Quels mécanismes ou facteurs font varier « Portefeuille optimal / Markowitz » ?","a":"La frontière efficiente rassemble les meilleurs compromis rendement-risque compte tenu des hypothèses. En pratique, les estimations de rendements espérés et covariances sont incertaines ; des contraintes de poids, de concentration, de frais ou de liquidité sont essentielles."},{"q":"Quel piège d'interprétation faut-il éviter avec « Portefeuille optimal / Markowitz » ?","a":"Le portefeuille optimal du modèle n’est pas « le meilleur portefeuille du monde » : il dépend des hypothèses et de l’aversion au risque de l’investisseur."}],"depth":[{"label":"Ce qu’optimise le modèle","text":"Le modèle moyenne–variance confronte rendement espéré et variance. Il distingue les portefeuilles inefficients des portefeuilles sur la frontière efficiente : pour chaque risque, le rendement espéré n’est pas améliorable sans prendre davantage de risque."},{"label":"Les données sont des hypothèses","text":"Les rendements moyens et covariances sont estimés et incertains. Une optimisation peut être très instable si les estimations sont bruitées ou si des contraintes de poids ne sont pas ajoutées."},{"label":"Ce qu’un quant doit vérifier","text":"Avant d’optimiser, il faut préciser horizon, univers, autorisation des ventes à découvert, frais, liquidité et scénarios. Une solution mathématique est inutile si elle ne correspond pas au mandat du client."}]},{"id":"allocation","title":"Allocation stratégique et tactique","group":"03 · Portefeuille & performance","page":"20–23, 169–180","chapter":5,"subtitle":"Répartir les risques puis prendre des paris","what":"L’allocation stratégique détermine les grandes expositions de long terme selon l’objectif et le profil du client. L’allocation tactique ajuste temporairement ces poids autour de la référence pour répondre à un scénario économique ou de marché.","how":"Le poly privilégie une démarche top-down : scénario macro → choix des classes d’actifs → géographies, secteurs et devises → sélection des titres. Une démarche bottom-up part de l’analyse des titres eux-mêmes. Les positions tactiques doivent respecter le mandat et ses limites.","worked":"Benchmark 60 % actions / 40 % obligations. Le gérant anticipe une récession et passe à 45 % actions / 55 % obligations, dans les limites autorisées. Il sous-pondère tactiquement les actions de 15 points.","trap":"Ne confonds pas allocation (répartition du capital) et sélection d’un titre précis. Une bonne intuition macro peut échouer si elle est mal temporisée.","visual":"portfolio","scenario":"Benchmark 50 % actions, 50 % obligations ; portefeuille 65 % actions, 35 % obligations. Quelle exposition active exprime-t-il ?","answers":["Sous-pondération des actions","Surpondération des actions de 15 points","Neutralité complète"],"correct":1,"feedback":"65 − 50 = +15 points sur les actions, compensés par −15 points sur les obligations.","q2":{"scenario":"La référence détient 40 % d’actions ; le gérant en détient 55 %. Quel est le pari actif en points ?","answers":["−15 points","+15 points","+55 points"],"correct":1,"feedback":"55−40=+15 points de surpondération en actions."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Allocation stratégique et tactique ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Allocation stratégique et tactique » en deux phrases.","a":"L’allocation stratégique détermine les grandes expositions de long terme selon l’objectif et le profil du client. L’allocation tactique ajuste temporairement ces poids autour de la référence pour répondre à un scénario économique ou de marché."},{"q":"Quels mécanismes ou facteurs font varier « Allocation stratégique et tactique » ?","a":"Le poly privilégie une démarche top-down : scénario macro → choix des classes d’actifs → géographies, secteurs et devises → sélection des titres. Une démarche bottom-up part de l’analyse des titres eux-mêmes. Les positions tactiques doivent respecter le mandat et ses limites."},{"q":"Quel piège d'interprétation faut-il éviter avec « Allocation stratégique et tactique » ?","a":"Ne confonds pas allocation (répartition du capital) et sélection d’un titre précis. Une bonne intuition macro peut échouer si elle est mal temporisée."}],"depth":[{"label":"Structure contre ajustement","text":"L’allocation stratégique exprime le profil de risque de long terme : combien d’actions, d’obligations et de monétaire ? L’allocation tactique modifie temporairement ces poids selon un scénario, tout en respectant les contraintes du mandat."},{"label":"Le coût d’un pari","text":"Surpondérer les actions de 10 points crée une exposition active. Si le scénario ne se réalise pas, le portefeuille peut sous-performer même si les actions montent : elles peuvent simplement progresser moins que les actifs sous-pondérés."},{"label":"Faire un vrai diagnostic","text":"Une allocation doit indiquer l’horizon, le benchmark, la tolérance au risque, les coûts de rééquilibrage et les variables qui feraient changer de scénario. Sans ces paramètres, un pourcentage d’actions isolé ne signifie pas grand-chose."}]},{"id":"beta","title":"Bêta","group":"03 · Portefeuille & performance","page":"30–31","chapter":6,"subtitle":"La sensibilité statistique au marché","what":"Le bêta mesure l’exposition d’un actif ou portefeuille aux variations de son benchmark : β = Cov(R_i,R_m)/Var(R_m). On peut l’interpréter comme la pente d’une régression linéaire des rendements de l’actif sur ceux du marché.","how":"Un bêta de 1,2 suggère une sensibilité moyenne 20 % supérieure à celle du marché dans les données utilisées, mais il ne prédit pas mécaniquement chaque journée. Le résidu de régression et l’alpha complètent l’analyse ; le bêta peut changer dans le temps.","worked":"Si Cov(R_i,R_m)=0,018 et Var(R_m)=0,015 (unités cohérentes), β=1,2. Une variation du marché de +1 % correspond à une contribution linéaire d’environ +1,2 %, pas à une garantie.","trap":"Le bêta n’est pas la volatilité totale : deux portefeuilles peuvent avoir le même bêta mais des risques spécifiques différents.","visual":"beta","scenario":"Deux fonds ont β=1 mais l’un est concentré sur trois entreprises risquées. Qu’en conclure ?","answers":["Ils ont exactement le même risque total","Ils ont une exposition linéaire de marché comparable, pas nécessairement le même risque spécifique","Le plus concentré est sans risque"],"correct":1,"feedback":"Le bêta ne résume pas toutes les sources de volatilité.","q2":{"scenario":"La covariance entre un fonds et son marché vaut 0,012 et la variance de marché 0,010. Quel bêta ?","answers":["0,83","1,2","12"],"correct":1,"feedback":"β=0,012 / 0,010=1,2. Les variances et covariances doivent être calculées sur une base cohérente."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Bêta ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Bêta » en deux phrases.","a":"Le bêta mesure l’exposition d’un actif ou portefeuille aux variations de son benchmark : β = Cov(R_i,R_m)/Var(R_m). On peut l’interpréter comme la pente d’une régression linéaire des rendements de l’actif sur ceux du marché."},{"q":"Quels mécanismes ou facteurs font varier « Bêta » ?","a":"Un bêta de 1,2 suggère une sensibilité moyenne 20 % supérieure à celle du marché dans les données utilisées, mais il ne prédit pas mécaniquement chaque journée. Le résidu de régression et l’alpha complètent l’analyse ; le bêta peut changer dans le temps."},{"q":"Quel piège d'interprétation faut-il éviter avec « Bêta » ?","a":"Le bêta n’est pas la volatilité totale : deux portefeuilles peuvent avoir le même bêta mais des risques spécifiques différents."}],"depth":[{"label":"Une pente statistique, pas une prédiction","text":"β=Cov(Rᵢ,Rₘ)/Var(Rₘ) peut être estimé en régressant le rendement du titre sur celui du marché. Il dépend de la fréquence, de la fenêtre et de l’indice choisi."},{"label":"Interprétation pratique","text":"β≈1,3 signifie une sensibilité historique supérieure au benchmark, mais le rendement du lendemain n’est pas fixé par cette pente. Le résidu spécifique et d’autres facteurs demeurent."},{"label":"Deux risques à distinguer","text":"La volatilité totale mesure toute la dispersion ; le bêta cherche une exposition systématique au benchmark. Un titre peut être volatil et avoir un bêta modéré si ses variations sont peu corrélées au marché."}]},{"id":"sharpe","title":"Ratio de Sharpe","group":"03 · Portefeuille & performance","page":"27–28","chapter":6,"subtitle":"Rendement excédentaire par unité de volatilité","what":"Le ratio de Sharpe compare le rendement excédentaire par rapport au taux sans risque au risque total mesuré par l’écart-type : S = (R_p − R_f)/σ_p. Il aide à comparer des stratégies de profil différent, avec des précautions.","how":"Les mesures doivent être sur des horizons cohérents (par exemple annualisés ensemble), et l’écart-type peut être un mauvais résumé des risques de queue. Un Sharpe élevé sur un petit historique peut être instable ; la comparaison doit tenir compte du risque de sélection.","worked":"A : rendement 10 %, taux sans risque 2 %, volatilité 16 % ⇒ Sharpe 0,50. B : rendement 8 %, taux sans risque 2 %, volatilité 8 % ⇒ Sharpe 0,75. B a un rendement plus faible mais un meilleur Sharpe.","trap":"Un Sharpe de 1 ne signifie pas 100 % de rentabilité ou 100 % de probabilité de gagner.","visual":"risk","scenario":"Deux fonds : A gagne 12 % avec 20 % de volatilité ; B gagne 9 % avec 10 %. Taux sans risque 2 %. Lequel a le meilleur Sharpe ?","answers":["A : 0,50","B : 0,70","Ils sont égaux"],"correct":1,"feedback":"A=(12−2)/20=0,50 ; B=(9−2)/10=0,70. B rémunère mieux le risque total pris.","q2":{"scenario":"Un fonds gagne 9 %, le taux sans risque est de 3 %, la volatilité 12 %. Quel Sharpe ?","answers":["0,50","0,75","1,50"],"correct":0,"feedback":"(9−3)/12=0,50, pour des pourcentages sur le même horizon."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Ratio de Sharpe ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Ratio de Sharpe » en deux phrases.","a":"Le ratio de Sharpe compare le rendement excédentaire par rapport au taux sans risque au risque total mesuré par l’écart-type : S = (R_p − R_f)/σ_p. Il aide à comparer des stratégies de profil différent, avec des précautions."},{"q":"Quels mécanismes ou facteurs font varier « Ratio de Sharpe » ?","a":"Les mesures doivent être sur des horizons cohérents (par exemple annualisés ensemble), et l’écart-type peut être un mauvais résumé des risques de queue. Un Sharpe élevé sur un petit historique peut être instable ; la comparaison doit tenir compte du risque de sélection."},{"q":"Quel piège d'interprétation faut-il éviter avec « Ratio de Sharpe » ?","a":"Un Sharpe de 1 ne signifie pas 100 % de rentabilité ou 100 % de probabilité de gagner."}],"depth":[{"label":"Comparer des horizons homogènes","text":"Le ratio (Rₚ−R𝒇)/σₚ doit utiliser des rendements et une volatilité exprimés sur le même horizon. Annualiser la volatilité suppose des hypothèses sur la dépendance temporelle."},{"label":"Un chiffre peut masquer les queues","text":"Deux stratégies de même Sharpe peuvent avoir des pertes extrêmes très différentes. Le ratio agrège la dispersion mais ne décrit pas toute la distribution des gains et pertes."},{"label":"La comparaison juste","text":"Comparer des ratios entre stratégies de nature différente demande de vérifier coûts, levier, horizon et fréquence des rendements. Un Sharpe estimé sur une petite période n’est pas une vérité intemporelle."}]},{"id":"tracking","title":"Tracking error et ratio d’information","group":"03 · Portefeuille & performance","page":"23–29","chapter":6,"subtitle":"Mesurer le risque et la valeur de la gestion active","what":"La tracking error est l’écart-type des rendements actifs (rendement du portefeuille moins rendement du benchmark), sur une fréquence et une période explicites. Le ratio d’information rapporte le rendement actif moyen annualisé à la tracking error annualisée.","how":"Deux fonds peuvent surperformer de 2 points sur un an, mais celui dont les écarts relatifs sont plus réguliers présente un ratio d’information plus élevé. Une tracking error faible peut être voulue par le mandat ; une forte tracking error n’implique pas une surperformance.","worked":"Surperformance annualisée : 1,5 point ; tracking error annualisée : 3 points. Information ratio = 1,5/3 = 0,50.","trap":"Le ratio d’information utilise un benchmark ; le Sharpe utilise un taux sans risque. Ils ne répondent pas à la même question.","visual":"risk","scenario":"Deux gérants affichent chacun +1 % d’excès de rendement annuel. Le premier a 2 % de tracking error, le second 5 %. Qui a le meilleur information ratio ?","answers":["Le premier","Le second","Le ratio ne dépend pas de la tracking error"],"correct":0,"feedback":"1/2=0,5 contre 1/5=0,2. Le premier a eu plus d’excès de rendement par unité de risque actif.","q2":{"scenario":"Quelle série faut-il utiliser pour mesurer une tracking error ?","answers":["Les cours bruts de l’indice","Les différences de rendements périodiques portefeuille−benchmark","Les seules périodes où le fonds gagne"],"correct":1,"feedback":"La tracking error est la volatilité des rendements actifs périodiques, avec annualisation cohérente."},"transfer":{"question":"Construis un contre-exemple à une interprétation trop rapide de « Tracking error et ratio d’information ». Quelle décision financière pourrait être mauvaise si l'on oublie ses limites ? Appuie ta réponse sur un mécanisme précis et un exemple différent de celui du cours.","rubric":["J'identifie l'hypothèse implicite et ses limites.","Je montre un mécanisme causal, et non une simple définition.","Je propose un exemple cohérent et j'indique ce qui pourrait invalider mon raisonnement."]},"flashcards":[{"q":"Sans regarder ton cours, explique la notion « Tracking error et ratio d’information » en deux phrases.","a":"La tracking error est l’écart-type des rendements actifs (rendement du portefeuille moins rendement du benchmark), sur une fréquence et une période explicites. Le ratio d’information rapporte le rendement actif moyen annualisé à la tracking error annualisée."},{"q":"Quels mécanismes ou facteurs font varier « Tracking error et ratio d’information » ?","a":"Deux fonds peuvent surperformer de 2 points sur un an, mais celui dont les écarts relatifs sont plus réguliers présente un ratio d’information plus élevé. Une tracking error faible peut être voulue par le mandat ; une forte tracking error n’implique pas une surperformance."},{"q":"Quel piège d'interprétation faut-il éviter avec « Tracking error et ratio d’information » ?","a":"Le ratio d’information utilise un benchmark ; le Sharpe utilise un taux sans risque. Ils ne répondent pas à la même question."}],"depth":[{"label":"Le risque de s’écarter de la référence","text":"La tracking error est l’écart-type des rendements actifs Rₚ−Rᵦ. Elle mesure la dispersion d
