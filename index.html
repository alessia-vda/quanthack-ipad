spectant son horizon, son objectif, les limites contractuelles et son aversion au risque. La <b>gestion passive<\/b> cherche à reproduire une référence (un indice, souvent via un ETF) ; la <b>gestion active<\/b> essaie de créer une performance relative supplémentaire. Aucune surperformance n’est garantie : frais et erreurs de prévision comptent.<\/p><p>Le poly confronte <b>analyse fondamentale<\/b> (profits, cash-flows, économie), <b>gestion quantitative<\/b> (décisions par modèles) et <b>analyse technique<\/b> (configurations de prix). Il oppose aussi le pilotage relatif à un <b>benchmark<\/b> à la recherche d’un objectif de performance dite absolue. Ces distinctions expliquent pourquoi un quant peut travailler avec un analyste macro et un gestionnaire de risque sans exercer le même métier.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 2–5. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"02 — Protection du client, conformité et organisation boursière","html":"<p>La <b>gestion pour compte de tiers<\/b> est encadrée par un mandat précisant l’univers d’investissement, le recours éventuel au levier ou aux dérivés, les contraintes de risque, les frais et l’information du client. Le devoir de connaissance du client (<i>know your customer<\/i>) et la prévention des conflits d’intérêts sont fondamentaux. Le cours cite AMF, autorité prudentielle, lutte anti-blanchiment, informations privilégiées et manipulation de cours.<\/p><p>Une bourse centralise des ordres acheteurs et vendeurs ; l’équilibre instantané du carnet d’ordres donne des prix exécutables, tandis qu’un <b>teneur de marché<\/b> peut apporter de la liquidité. Les indices condensent la performance d’un ensemble de valeurs ; l’indice n’est pas le portefeuille physique d’un investisseur. Le schéma de carnet d’ordres Renault (p. 14) illustre bid/ask et profondeur.<\/p><p><b>À vérifier :<\/b> montants de sanctions, dénominations de segments, indices et horaires de cotation du cours sont historiques. Voir F1 pour les métiers, F4 pour les ordres et F6 pour les risques bancaires.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 6–15. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"03 — Classes d’actifs, benchmark et diversification","html":"<p>Le poly raisonne d’abord sur trois classes : <b>actions<\/b> (participation au capital), <b>obligations<\/b> (créance), <b>monétaire<\/b> (placements et financement de court terme). Les dérivés servent notamment à modifier ou couvrir les expositions. Un benchmark constitue un point de comparaison explicite ; il peut lui-même combiner plusieurs classes et zones géographiques.<\/p><p>Pour deux investissements, le risque du portefeuille dépend à la fois des risques individuels et de leur <b>corrélation<\/b> : la diversification n’exige pas uniquement « beaucoup de titres », mais surtout des expositions suffisamment différentes. Le diagramme du cours (p. 19) représente la baisse puis la stabilisation du risque lorsque le nombre de titres augmente. La partie idiosyncratique peut être réduite, mais pas le risque commun du marché.<\/p><p><b>Point critique :<\/b> la règle de « 25 titres » donnée p. 18 est une heuristique située, <em>pas un seuil universel<\/em> ; tout dépend des concentrations, corrélations et coûts. Voir F2/F3 pour les contrats d’actifs et T6 pour optimiser sous contraintes.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 16–20. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"04 — Markowitz et le portefeuille optimal","html":"<p>L’approche de Markowitz consiste à choisir les poids des titres pour arbitrer rendement espéré et variance. Pour des poids \\(w\\), des rendements espérés \\(\\mu\\) et une matrice de covariance \\(\\Sigma\\), \\(\\mathbb E[R_p]=w^\top\\mu\\) et \\(\\mathrm{Var}(R_p)=w^\top\\Sigma w\\). Ces identités découlent de la linéarité de l’espérance et de la covariance des combinaisons linéaires. La <b>frontière efficiente<\/b> désigne les portefeuilles non dominés en risque/rendement selon les contraintes choisies.<\/p><p>Une covariance estimée sur le passé ne garantit pas qu’elle sera stable dans le futur. Le professeur insiste sur cet écart entre optimisation statistique et anticipation du cycle économique : une gestion peut combiner résultats quantitatifs et scénario économique argumenté. Ta formation M2 permet de comprendre les erreurs d’estimation, la régularisation et la validation hors échantillon ; ces aspects sont détaillés en T6.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 20, 25–27. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"05 — Allocation stratégique, tactique : top-down et bottom-up","html":"<p>La <b>répartition stratégique<\/b> désigne les proportions de référence des grandes classes d’actifs, cohérentes avec le profil du client. L’<b>allocation tactique<\/b> consiste à surpondérer ou sous-pondérer temporairement une classe, une zone, un thème ou un secteur relativement au benchmark, selon un scénario.<\/p><p><b>Top-down :<\/b> analyser d’abord le contexte mondial et les politiques économiques, puis décider de la répartition géographique et sectorielle, enfin choisir les titres. <b>Bottom-up :<\/b> sélectionner d’abord des entreprises pour leurs caractéristiques propres. Une <b>poche<\/b> représente une subdivision du portefeuille (ex. actions françaises). Les <b>limites d’intervention<\/b> bornent les expositions admissibles ; l’univers de gestion définit ce qu’il est possible de détenir.<\/p><p><b>Cas mental :<\/b> si le benchmark alloue 35 % aux actions et le gérant 45 %, la poche actions est surpondérée de 10 points de pourcentage (valeur calculée par script pour l’exercice). Ce pari peut améliorer la performance ou aggraver la perte.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 21–24. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"06 — Mesurer la performance relative et le risque","html":"<p>On calcule le <b>rendement actif<\/b> \\(R_p-R_b\\), puis la <b>tracking error<\/b> comme écart-type de cette série active. Le <b>ratio d’information<\/b> est une surperformance moyenne divisée par cette volatilité active (si elle est non nulle) ; le <b>ratio de Sharpe<\/b> compare le rendement excédentaire par rapport au taux sans risque à la volatilité du portefeuille.<\/p><p>Le <b>bêta<\/b> \\(\\mathrm{Cov}(R_p,R_b)/\\mathrm{Var}(R_b)\\) mesure une sensibilité linéaire à l’indice, tandis que le <b>ratio de Treynor<\/b> compare l’excès de rendement au bêta (si ce dernier n’est pas nul). Ils ne sont ni équivalents ni interchangeables : Sharpe pénalise la volatilité totale, Treynor normalise par l’exposition systématique au benchmark et le ratio d’information se centre sur les écarts au benchmark.<\/p><p><b>Précaution :<\/b> ces formules exigent des fréquences cohérentes, des définitions précises du taux sans risque et un historique pertinent. Un bêta n’est pas une prévision exacte : la relation statistique comporte des résidus. Voir T5 (modèles de facteurs), T6 (portefeuille) et R3 (validation).<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 23–32. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"07 — VaR et simulations de Monte Carlo","html":"<p>La <b>Value-at-Risk<\/b> se lit comme un seuil quantile de pertes sur un horizon, sous une probabilité donnée. Ce n’est <b>pas<\/b> la pire perte concevable : des événements de queue peuvent dépasser le seuil. On doit annoncer le niveau de confiance, l’horizon, l’unité de perte, la convention de signe et la méthode (historique, paramétrique, simulation).<\/p><p>Le professeur illustre une estimation de VaR normale, puis les limites des hypothèses gaussiennes : asymétrie, queues épaisses et crises. Le chapitre suivant utilise le principe de simulations de trajectoires avec drift et chocs aléatoires puis calcule des quantiles. En M2 tu sais déjà simuler des lois : l’enjeu supplémentaire est la calibration, la dépendance, le choix des données et le backtesting.<\/p><p><b>À vérifier dans le poly :<\/b> la p. 33 présente un quantile négatif de rendement comme « VaR », alors que plusieurs conventions professionnelles présentent une VaR de <i>perte positive<\/i>. Le signe doit être explicité plutôt que recopié tel quel. Voir R1–R3 pour méthodes et backtests.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 33–38. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"08 — Balance des paiements et économie ouverte","html":"<p>La <b>balance des paiements<\/b> organise les transactions d’une économie avec le reste du monde. La <b>balance courante<\/b> regroupe les échanges de biens et services, les revenus primaires et secondaires ; la balance financière recense des acquisitions/cessions d’actifs et de passifs financiers selon une convention comptable. Une <b>balance commerciale<\/b> de biens et services se calcule par exportations moins importations.<\/p><p>Le cours examine comment déficits, excédents, investissements directs, dette extérieure et réserves peuvent interagir. Il illustre les relations par des comptes de la France et de l’Allemagne pour 2008–2016 (pp. 42–44) et par des identités de flux (p. 45). Une <b>identité comptable<\/b> n’établit pas à elle seule une causalité économique : on évitera donc d’inférer mécaniquement qu’un déficit commercial produit toujours un endettement public.<\/p><p>Ce chapitre donne le vocabulaire nécessaire pour lire des publications du FMI ou de banques centrales. Les statistiques imprimées sont historiques et non une description des comptes de 2026.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 39–47. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"09 — Inflation, monnaie, crédit et politique monétaire","html":"<p>L’<b>inflation<\/b> désigne l’augmentation du niveau général des prix sur une période. Le poly l’étudie via une perspective monétaire et l’équation des échanges \\(MV=PQ\\) : masse monétaire \\(M\\), vitesse de circulation \\(V\\), niveau des prix \\(P\\), production réelle \\(Q\\). L’identité ne signifie pas qu’une variation de \\(M\\) se traduit automatiquement et immédiatement par la même variation de \\(P\\) : \\(V\\) et \\(Q\\) importent.<\/p><p>Les <b>banques commerciales<\/b> créent des dépôts lorsqu’elles accordent un crédit ; leur activité dépend de la demande solvable, des fonds propres, de la liquidité et de la réglementation. Les <b>banques centrales<\/b> pilotent des taux directeurs et le cadre de liquidité. Les <b>opérations d’open market<\/b> et les <b>achats d’actifs<\/b> (quantitative easing, QE) sont des instruments différents, avec des effets transmis à l’économie par plusieurs canaux.<\/p><p><b>À vérifier — actualisation :<\/b> les anciens niveaux de taux, agrégats et outils présentés par le poly ne doivent pas servir de référence pour la BCE en 2026. Voir F8 pour un mini-cas de politique monétaire.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 48–55, 82–89. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"10 — Crises : les mécanismes de contagion","html":"<p>Le cours retrace notamment la crise asiatique et japonaise, la Russie en 1998, le fonds <b>LTCM<\/b>, la bulle technologique, puis la crise immobilière américaine. Son fil analytique est : crédit et levier → prix d’actifs trop éloignés des fondamentaux → choc de confiance → contraintes de liquidité → ventes forcées → contagion.<\/p><p><b>LTCM<\/b> illustre qu’un modèle de convergence de spreads peut devenir fragile lorsque les mouvements de marché excèdent ses scénarios, surtout avec levier et dépendance entre positions. Les affaires Enron et WorldCom servent à discuter l’asymétrie d’information, la qualité des états financiers et les contrôles internes, puis la loi Sarbanes-Oxley (p. 81).<\/p><p>Les dates et chiffres donnés dans les diapositives servent à situer les crises historiques ; ils ne constituent pas des statistiques de marché actuelles. Une interprétation des causes doit distinguer faits historiques et thèse analytique du professeur.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 55–81. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"11 — Titrisation, MBS, CDO et CDS","html":"<p>La <b>titrisation<\/b> transforme un ensemble de créances en titres détenus par des investisseurs. Les <b>MBS<\/b> sont adossés à des crédits hypothécaires ; les <b>CDO<\/b> structurent des portefeuilles de créances en tranches de priorité de paiement ; un <b>CDS<\/b> est un dérivé de crédit permettant de transférer sous contrat une exposition à un événement de crédit, contre primes.<\/p><p>Le professeur schématise en p. 68 le chemin <b>emprunteur → banque originatrice → véhicule de titrisation → investisseurs<\/b>, avec couverture possible. Le risque n’est pas magiquement éliminé : il peut être redistribué, concentré ou masqué et devenir difficile à mesurer en situation de crise.<\/p><p>Pour un profil quant risque, le lien se fait avec <b>PD, LGD, EAD<\/b>, corrélations de défauts, stress tests et risque de contrepartie (R4–R6). Les descriptions d’institutions et de CDS du cours sont historiques ; leur portée juridique et réglementaire actuelle reste <b>à vérifier<\/b>.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 51–52, 65–74. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"12 — Politique budgétaire, FMI, Union économique et monétaire","html":"<p>La <b>politique budgétaire<\/b> intervient par les dépenses publiques, la fiscalité et l’endettement ; la <b>politique monétaire<\/b> dépend de la banque centrale. Le <b>policy mix<\/b> combine ces décisions. Le professeur présente les missions du <b>FMI<\/b>, sa gouvernance et différentes critiques, puis les étapes historiques de l’intégration européenne.<\/p><p>Dans l’<b>UEM<\/b>, l’existence d’une monnaie commune implique que les décisions monétaires ne sont pas choisies individuellement par chaque État. Les critères de Maastricht et le Pacte de stabilité apparaissent dans le cours comme des tentatives de convergence et de discipline budgétaire. La BCE y est présentée comme institution centrale du système.<\/p><p><b>À vérifier — institutions en 2026 :<\/b> seuils, textes, composition de l’Union, pouvoirs et programmes changent dans le temps. Ne traite pas les nombres et organigrammes d’anciennes diapositives comme des paramètres réglementaires actuels.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 90–107. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"13 — Euro, dettes souveraines et nouvelles protections bancaires","html":"<p>Le poly consacre un large ensemble aux <b>déséquilibres courants et budgétaires<\/b>, à la crise des dettes souveraines en zone euro, aux écarts de taux entre obligations d’État et aux programmes d’aide et de stabilité. Les notions clés à retenir sont le <b>spread souverain<\/b>, le risque de refinancement, la soutenabilité de la dette, les mécanismes européens de stabilité et les interactions entre solvabilité bancaire et souveraine.<\/p><p>Le cours évoque les dispositifs FESF, MES, OMT, le cadre de surveillance et la construction de l’Union bancaire, ainsi que <b>Bâle III<\/b> : fonds propres, ratio de levier et supervision des risques. Pour ton futur stage, la logique d’analyse est très utile : un choc souverain peut dévaloriser des obligations détenues par les banques et menacer leur capacité à financer l’économie.<\/p><p><b>À vérifier avant usage en entretien :<\/b> chronologie exacte, état juridique actuel des mécanismes, chiffres de ratios et structures de supervision. Ce chapitre est une introduction historique, pas un manuel de conformité 2026.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 108–167. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"13A — Rééquilibrages internationaux, BRIC et flux de capitaux","html":"<p>Le professeur étudie comment les <b>balances courantes<\/b>, les décisions d'épargne et d'investissement et la circulation mondiale des capitaux ont évolué entre les grandes zones économiques. Il s'intéresse particulièrement aux pays émergents regroupés sous le terme historique « BRIC » et à leurs interdépendances avec les États-Unis et la zone euro.<\/p><p>La question à poser à chaque exemple est : <b>qui épargne ? qui emprunte ? dans quelle devise ?<\/b> Une monnaie, un débiteur et un prêteur sont liés par des créances et des engagements différents. Une dépréciation du change peut modifier la valeur d'une dette libellée en monnaie étrangère. Il faut éviter d'assimiler automatiquement déficit courant et déficit public : les flux des ménages, entreprises et États sont distincts.<\/p><p>Les graphiques et prévisions du poly reflètent leur période de rédaction : ni les classements de croissance, ni les parts d'échanges ni les niveaux d'endettement historiques ne doivent être généralisés à 2026.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 108–117. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"13B — Déséquilibres structurels dans la zone euro","html":"<p>Une union monétaire partage une devise mais rassemble des économies hétérogènes. Le poly compare des balances courantes et des structures de dette entre pays membres, puis discute les mécanismes de liquidité de la BCE, notamment les <b>LTRO<\/b> (opérations de refinancement à long terme) et les soldes <b>TARGET2<\/b> (écritures reflétant les paiements entre systèmes nationaux de banques centrales).<\/p><p>L'idée centrale est que des différences de compétitivité, de financement bancaire et de demande intérieure peuvent persister à l'intérieur d'une zone sans taux de change national. Des écarts de rendement souverain ou une crise bancaire peuvent aggraver ces divergences. Le cours utilise aussi des scénarios de parité de change fixe pour montrer des tensions possibles.<\/p><p><b>Attention :<\/b> une relation comptable n'indique pas à elle seule la direction d'une causalité. L'interprétation de TARGET2 et des déséquilibres est débattue ; le cours apporte une grille historique, à compléter par des publications officielles récentes avant de la réutiliser.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 118–142. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"13C — La crise grecque et les mécanismes de stabilisation","html":"<p>À partir de la crise grecque, le professeur décrit la difficulté pour un État de refinancer sa dette lorsque la confiance de marché se détériore. Une hausse de rendement exigé fait baisser le prix des obligations déjà émises et peut accroître le coût des nouveaux emprunts. Les banques qui détiennent ces titres subissent alors des pertes de valorisation : c'est une partie du <b>lien souverain–banque<\/b>.<\/p><p>Dans le cours figurent les premiers plans de soutien, le FESF, les négociations sur les règles budgétaires, le « Six-Pack », le TSCG et le « Two-Pack ». À ce stade F0 cherche à comprendre le <b>problème économique<\/b> que ces dispositifs tentent de résoudre : liquidité immédiate, incitations budgétaires, coordination et prévention d'une contagion.<\/p><p><b>À vérifier en 2026 :<\/b> les montants, instruments et dispositions juridiques du cours sont datés. Pour un entretien, mieux vaut savoir décrire le mécanisme que réciter un chiffre historique sans date.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 143–155. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"13D — MES, Union bancaire et trois piliers prudentiels","html":"<p>Le poly poursuit avec les mécanismes européens de stabilité et les dispositifs de supervision du secteur financier. Le <b>MES<\/b> s'inscrit dans la réponse à la crise des dettes souveraines ; les dispositifs de résolution bancaire visent à traiter les banques en difficulté sans contagion incontrôlée.<\/p><p>Pour la gestion des risques, retiens les trois grandes dimensions prudentielles discutées sous <b>Bâle III<\/b> : capacité d'absorption des pertes par les fonds propres, gestion et contrôle internes des risques, et discipline apportée par les informations publiées. Des ratios de capital, de levier et de liquidité encadrent l'activité bancaire, sous des définitions réglementaires précises.<\/p><p><b>À vérifier :<\/b> la composition actuelle des exigences, les seuils et les organes de supervision peuvent différer des diapositives. Le cadre conceptuel conduit ensuite vers F6 (banque), R10 (validation) et R8/R9 (ALM et solvabilité).<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 156–167. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"14 — Indicateurs de conjoncture et scénarios","html":"<p>Un gérant formule un <b>scénario macroéconomique<\/b> à partir d’indicateurs de production (production industrielle, capacités utilisées, indices PMI/ISM), de demande (consommation, confiance), du marché du travail (chômage), des prix (<b>CPI<\/b>, <b>PPI<\/b>, inflation sous-jacente) et des conditions de financement.<\/p><p>Le but n’est pas d’empiler des séries : on cherche à anticiper une phase du cycle, les bénéfices des entreprises, la réaction probable des banques centrales et l’évolution relative des classes d’actifs. Ces variables sont souvent révisées et leur disponibilité est datée : éviter le <b>look-ahead bias<\/b> en backtesting (voir T7–T9).<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 168–169. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"15 — Choix d’actifs, courbe des taux et obligations","html":"<p>Le poly illustre l’arbitrage entre <b>monétaire, obligations et actions<\/b> selon le cycle anticipé. Un gérant peut changer les poids de ses poches ou la répartition par zone géographique. Sur les obligations, il peut modifier son exposition aux maturités de la <b>courbe des taux<\/b>, au crédit de qualité ou <b>high yield<\/b>, ou couvrir une partie du risque de taux.<\/p><p>Une obligation promet des flux déterminés par son contrat, mais son <b>prix de marché<\/b> varie avec les taux et la perception du risque d’émetteur. À flux fixes constants, une hausse des rendements exigés fait baisser son prix. La <b>duration<\/b> mesure une sensibilité locale ; la convexité améliore l’approximation pour les mouvements plus marqués. Voir F3 puis T11/R7 pour les calculs.<\/p><p>La p. 175 propose un cas de construction d’allocation à partir d’un scénario ; nous le transposons dans une tâche d’ordre plutôt que réutiliser ses données historiques.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 170–176. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"16 — Actions : valorisation, thèmes, secteurs et stock picking","html":"<p>Pour sélectionner une action, le gérant évalue la capacité de l’entreprise à créer de la valeur. Le <b>PER<\/b> compare prix et bénéfice par action ; le <b>ROE<\/b> rapporte le résultat aux capitaux propres ; la trésorerie disponible, l’endettement, les flux et la qualité comptable sont des éléments centraux. Le cours distingue des styles <b>growth<\/b>, <b>value<\/b>, <b>quality<\/b> et cycliques ainsi que des choix sectoriels dépendant de la conjoncture.<\/p><p>La valorisation par <b>multiples<\/b> compare un titre à des références, alors qu’une approche par <b>actualisation des flux<\/b> relie valeur et flux futurs attendus sous des hypothèses fortes. Le <b>modèle de Gordon–Shapiro<\/b>, sous croissance perpétuelle constante et sous \\(k>g\\), s’écrit \\(P=D_1/(k-g)\\) ; la formule vient de la somme d’une série géométrique de dividendes actualisés et ne s’applique pas automatiquement à toute entreprise.<\/p><p>Les pages 188–190 donnent une étude chiffrée de Lafarge, située historiquement ; cette base reprend les <em>mécanismes<\/em> de valorisation avec de nouveaux nombres fictifs calculés par script, sans recopier la correction du professeur.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 177–190. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"17 — Analyse technique : limite du support reçu","html":"<p>La dernière diapositive du fichier fourni annonce « V – Analyse technique » mais ne développe pas de méthodes. Les graphiques de tendances, indicateurs de momentum, stratégies et résultats éventuels du professeur sont donc <b>à vérifier — absents du poly fourni<\/b>.<\/p><p>Ne pas confondre <b>analyse technique<\/b> et <b>backtesting quantitatif<\/b> : un signal testé sur des historiques requiert des données correctement horodatées, une validation temporelle et la prise en compte des coûts d’exécution. Ces aspects seront enseignés dans les rooms Trading prévues.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 191. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"},{"titre":"18 — Carte des liens avec QuantHack et méthode de révision","html":"<p>Après F0 : <b>F1<\/b> acteurs et métiers, <b>F2<\/b> actions/indices, <b>F3<\/b> taux et obligations, <b>F4<\/b> ordres, <b>F5<\/b> dérivés, <b>F6<\/b> banque/régulation, <b>F7<\/b> assurance, <b>F8<\/b> actualité et inflation. En spécialisation : <b>T5/T6<\/b> bêta et Markowitz ; <b>T7–T9<\/b> backtests et ML ; <b>R1–R3<\/b> VaR ; <b>R7–R9<\/b> sensibilité et ALM.<\/p><p>Pour mémoriser : explique à voix haute pourquoi un investisseur compare son portefeuille à un benchmark ; résous le cas numérique de pondération ; distingue les trois dénominateurs de Sharpe/Treynor/Information ; relie une hausse de taux au prix obligataire ; raconte un exemple de contagion financière sans chiffres. Les flashcards permettent d’espacer les rappels.<\/p><p>Dans cette F0, les chapitres 0–17 forment une <b>base de consultation<\/b>. Le parcours guidé de 90 min sélectionne les fondamentaux et les exercices ; il n’a pas vocation à remplacer les 191 pages du support d’origine.<\/p><p><small>Source universitaire : Xavier Barberis, <i>Gestion de portefeuille<\/i> (polycopié de cours fourni, reproduction interdite), p. 3, 16–38, 168–191. Reformulation pédagogique originale, non reproduction.<\/small><\/p>"}]};

function stepContent(c,n){if(n===0)return `<div class="screen-kicker">01 / L'INTUITION</div><h2 class="screen-title">Qu'est-ce que c'est, exactement ?</h2><div class="prose"><p>${esc(c.what)}</p></div><div class="callout"><strong>LA QUESTION À SE POSER</strong>Quel droit, quel risque et quel flux financier se cachent derrière cet instrument ou cette notion ? Essaie de répondre avec tes mots avant de passer à l'étape suivante.</div>`;
if(n===1)return `<div class="screen-kicker">02 / ALLER PLUS LOIN</div><h2 class="screen-title">Comment ça fonctionne ?</h2><div class="prose"><p>${esc(c.how)}</p>${(c.depth||[]).map(x=>`<h3 style="font:600 17px/1.3 -apple-system,Arial;margin:25px 0 6px;color:var(--mint)">${esc(x.label)}</h3><p>${esc(x.text)}</p>`).join('')}</div><div class="diagram">${illustration(art(c),c.title)}<small>Schéma de principe pour visualiser l'idée ; il ne représente pas des données de marché réelles.</small></div>`;
if(n===2)return `<div class="screen-kicker">03 / L'APPLICATION</div><h2 class="screen-title">Un exemple pour relier les idées</h2><div class="prose"><p>${esc(c.worked)}</p></div><div class="callout"><strong>LE PIÈGE CLASSIQUE</strong>${esc(c.trap)}</div>${calcLab(c)}`;
if(n===3)return quizContent(c);
if(n===4)return flashLesson(c);
return `<div class="screen-kicker">06 / CONSOLIDER</div><h2 class="screen-title">Sais-tu l'expliquer ?</h2><p class="lede">Un dernier exercice de transfert : ton objectif est de justifier une décision, pas de répéter une définition.</p><div class="open-response"><label for="freeAnswer" class="quiz-q" style="font-size:20px">${esc(c.transfer.question)}</label><textarea id="freeAnswer" placeholder="Rédige un petit raisonnement avec un exemple…">${esc(s.answers[c.id]||'')}</textarea><button class="button alt small" id="rubricBtn">Afficher la grille d'autocorrection ↓</button><div id="rubric" hidden><div class="rubric">${c.transfer.rubric.map(r=>`<label><input type="checkbox">${esc(r)}</label>`).join('')}</div><div class="feedback"><strong>Ce que le cours veut éviter</strong>${esc(c.trap)}</div></div></div><div class="callout"><strong>POUR APPROFONDIR</strong>Tu peux ensuite reprendre le cours universitaire complet dans « Cours M1 », ou passer à une nouvelle notion. La répétition espacée des flashcards se trouve dans « Révisions ».</div>`}
function calcLab(c){if(c.id==='obligation')return `<div class="callout" style="border-color:var(--lav)"><strong>MINI-SIMULATEUR · OBLIGATION ZÉRO-COUPON</strong><label>Rendement exigé : <b id="rateValue">4</b> % <input id="rateSlider" type="range" min="0" max="12" step=".5" value="4" style="width:100%;margin:16px 0"></label><div class="formula" id="priceResult">1 000 / (1,04)² = 924,56 €</div><small>Capital remboursé : 1 000 € dans 2 ans. Manipule le taux : observe la relation prix–rendement.</small></div>`;
if(c.id==='action')return `<div class="callout" style="border-color:var(--lav)"><strong>MINI-SIMULATEUR · RENDEMENT TOTAL</strong><label>Cours final : <b id="stockValue">54</b> € <input id="stockSlider" type="range" min="35" max="70" step="1" value="54" style="width:100%;margin:16px 0"></label><div class="formula" id="stockReturn">(54 − 50 + 1,50) / 50 = 11 %</div><small>Achat 50 €, dividende 1,50 €. La plus-value seule ne résume pas le rendement total.</small></div>`;
return ''}
function quizContent(c){const q=[{scenario:c.scenario,answers:c.answers,correct:c.correct,feedback:c.feedback},c.q2];const idx=Math.min(1,Number(s.quizIndex?.[c.id]||0));const d=q[idx];let done=Boolean(s.solved[c.id+':'+idx]);return `<div class="screen-kicker">04 / RAISONNER</div><div class="breadcrumbs"><span>Cas ${idx+1} sur 2</span><span class="status-pill">${completed(c)}/2 validés</span></div><h2 class="screen-title">Un problème, pas une récitation.</h2><div class="quiz-q">${esc(d.scenario)}</div><div class="answers">${d.answers.map((a,j)=>`<button class="answer" data-answer="${j}"><span class="letter">${'ABC'[j]}</span><span>${esc(a)}</span></button>`).join('')}</div><div id="feedbackBox"></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:19px"><button class="button alt small" data-quiz="0">Cas 1 ${s.solved[c.id+':0']?'✓':''}</button><button class="button alt small" data-quiz="1">Cas 2 ${s.solved[c.id+':1']?'✓':''}</button></div>${done?'<div class="feedback"><strong>Tu as déjà validé ce cas.</strong>Tu peux refaire le raisonnement sans gagner à nouveau des XP.</div>':''}`}
function flashLesson(c){return `<div class="screen-kicker">05 / MÉMORISER</div><h2 class="screen-title">Retiens l'essentiel, puis retrouve-le demain.</h2><p class="help">Trois cartes différentes par notion : définition, mécanisme et piège. Retourne chaque carte avant de te noter.</p><div id="localFlash"></div>`}
function progressButton(){return ''}
function courseList(){return `<div class="eyebrow">BASES FINANCIÈRES / COURS COMPLET</div><h1 class="page-title serif">Les bases, <i style="color:var(--mint)">en profondeur.</i></h1><p class="lede">23 chapitres reformulés d'après le plan du poly de Xavier Barberis. Contrairement aux fiches, cette section conserve le fil du cours : réglementation, marchés, Markowitz, crises, politique monétaire, allocation et valorisation.</p><div class="overview"><div class="overview-list">${chapters.map((c,i)=>`<a href="#/chapitre/${i}" class="overview-row"><span>${String(i+1).padStart(2,'0')}</span><strong>${esc(c.titre)}</strong><small>Lire ↗</small></a>`).join('')}</div></div>`}
function courseChapter(index){const c=chapters[index];if(!c)return notFound();return `<div class="breadcrumbs"><a href="#/cours">Tous les chapitres</a><span>›</span><span>Chapitre ${index+1}</span></div><div class="eyebrow">BASES FINANCIÈRES · GESTION DE PORTEFEUILLE</div><h1 class="page-title serif">${esc(c.titre)}</h1><div class="progressbar"><i style="width:${100*(index+1)/chapters.length}%"></i></div><div class="learning-layout"><div class="step-nav"><a class="textlink" href="#/cours">← Vue d'ensemble</a><span class="tiny">${index+1} / ${chapters.length} chapitres</span></div><section class="lesson-pane"><div class="bookcopy">${c.html}</div><div class="lesson-controls"><a class="button alt small" href="#/chapitre/${Math.max(index-1,0)}" ${index===0?'aria-disabled="true"':''}>← Précédent</a><span class="step-count">${index+1} / ${chapters.length}</span><a class="button small" href="#/chapitre/${Math.min(index+1,chapters.length-1)}">Suivant →</a></div><div class="tinyfooter">Synthèse originale du polycopié fourni. Ne constitue pas une reproduction intégrale et ne remplace pas les sources à jour pour la réglementation.</div></section></div>`}
function dueCards(){let today=new Date().toISOString().slice(0,10),all=notions.flatMap(c=>c.flashcards.map((f,i)=>({...f,id:c.id+':'+i,notion:c.title})));return all.filter(f=>!s.cards[f.id]||s.cards[f.id].due<=today)}
function review(){let cards=dueCards();s.currentReview=s.currentReview&&cards.some(c=>c.id===s.currentReview)?s.currentReview:cards[0]?.id;const f=cards.find(x=>x.id===s.currentReview);return `<div class="eyebrow">RÉPÉTITION ESPACÉE</div><h1 class="page-title serif">Réviser sans <i style="color:var(--lav)">relire.</i></h1><p class="lede">Pour chaque carte : essaie de répondre avant de retourner. Note ensuite si tu as réellement su expliquer le mécanisme.</p><div class="revisions"><div class="review-stats"><strong>${cards.length}</strong><div class="help">cartes à revoir aujourd'hui</div></div><div class="review-stats"><strong>${notions.length*3-cards.length}</strong><div class="help">cartes programmées pour plus tard</div></div></div>${f?`<div class="flashcard" id="reviewFlip"><span class="eyebrow">${esc(f.notion)}</span><q>${esc(f.q)}</q><div class="back" hidden>${esc(f.a)}</div><div class="help">Toucher pour voir la réponse</div></div><div class="flash-actions" id="reviewActions" hidden><button class="button alt" data-grade="again">À revoir</button><button class="button" data-grade="good">Je l'explique ✓</button></div>`:`<div class="empty">Bravo, rien à réviser pour le moment. Les cartes reviendront selon leur date de révision.</div>`}`}
function notFound(){return `<h1 class="page-title serif">Page introuvable</h1><p>Reviens à <a class="textlink" href="#/">l'accueil</a>.</p>`}
function render(){nav();let hash=decodeURIComponent(location.hash.slice(2)),[p,a,b]=hash.split('/');if(!p)p='';if(p==='f0-atelier'){$('#view').innerHTML=qcF0List()}else if(p==='f0-mission'){$('#view').innerHTML=qcF0View(a);qcF0Setup(a)}else if(p==='notions'){const f=a===undefined?null:+a;$('#view').innerHTML=library(Number.isFinite(f)?f:null);setupLibrary()}else if(p==='notion'){$('#view').innerHTML=lesson(a,Math.min(5,Math.max(0,+(b||0))));setupLesson(a,+(b||0))}else if(p==='cours')$('#view').innerHTML=courseList();else if(p==='chapitre')$('#view').innerHTML=courseChapter(Number(a)||0);else if(p==='revision'){$('#view').innerHTML=review();setupReview()}else if(p==='parcours')$('#view').innerHTML=extPathPage();
else if(p==='rooms')$('#view').innerHTML=srOverview();
else if(p==='room'){$('#view').innerHTML=srRoomPage(a,b,hash.split('/')[3]);srSetup(a,b,hash.split('/')[3])}
else if(p==='exercices'){$('#view').innerHTML=extPracticePage();extSetupPractice()}
else if(p==='python'){$('#view').innerHTML=extPythonPage();extSetupCode()}
else if(p==='specialisations')$('#view').innerHTML=extTracksPage();
else if(p==='sources')$('#view').innerHTML=extSourcesPage();
else $('#view').innerHTML=home()+extDashboard();window.scrollTo(0,0);if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([$('#view')]).catch(()=>{})}
function setupLibrary(){let idx=Number(location.hash.split('/')[2]);if(!Number.isFinite(idx))idx=-1;const redraw=()=>{const q=$('#query').value.trim().toLowerCase(),items=notions.filter(c=>(idx===-1||c.group===groups[idx])&&(!q||(c.title+' '+c.subtitle+' '+c.group).toLowerCase().includes(q)));$('#notionGrid').innerHTML=items.length?items.map(card).join(''):'<div class="empty">Aucune notion trouvée.</div>';document.querySelectorAll('.chip').forEach((b,i)=>b.classList.toggle('active',Number(b.dataset.filter)===idx))};$('#query').oninput=redraw;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{idx=+b.dataset.filter;redraw()});redraw()}
function setupLesson(id,st){const c=notions.find(x=>x.id===id);if(!c)return;document.querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>location.hash=`#/notion/${id}/${el.dataset.step}`);document.querySelectorAll('[data-move]').forEach(el=>el.onclick=()=>location.hash=`#/notion/${id}/${Math.max(0,Math.min(5,st+Number(el.dataset.move)))}`);const next=$('[data-nextconcept]');if(next)next.onclick=()=>{let n=notions.findIndex(x=>x.id===id);location.hash='#/notion/'+notions[(n+1)%notions.length].id+'/0'};
if(st===2){let r=$('#rateSlider');if(r){let go=()=>{$('#rateValue').textContent=r.value;let n=1000/Math.pow(1+Number(r.value)/100,2);$('#priceResult').textContent=`1 000 / (1 + ${r.value}/100)² = ${n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})} €`};r.oninput=go;go()}let a=$('#stockSlider');if(a){let go=()=>{$('#stockValue').textContent=a.value;let n=100*(Number(a.value)-50+1.5)/50;$('#stockReturn').textContent=`(${a.value} − 50 + 1,50) / 50 = ${n.toLocaleString('fr-FR',{maximumFractionDigits:1})} %`};a.oninput=go;go()}}
if(st===3){s.quizIndex=s.quizIndex||{};let idx=s.quizIndex[id]||0;let q=[{correct:c.correct,feedback:c.feedback},c.q2][idx];document.querySelectorAll('[data-quiz]').forEach(el=>el.onclick=()=>{s.quizIndex[id]=+el.dataset.quiz;save();render()});document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>{let ans=Number(el.dataset.answer),ok=ans===q.correct;document.querySelectorAll('[data-answer]').forEach(b=>{b.classList.toggle('selected',b===el);b.classList.toggle('correct',+b.dataset.answer===q.correct&&ok);b.classList.toggle('wrong',b===el&&!ok)});let box=$('#feedbackBox');box.innerHTML=`<div class="feedback"><strong>${ok?'✓ Bon raisonnement.':'Ce raisonnement ne fonctionne pas encore.'}</strong>${esc(q.feedback)}${ok?'<br><small>Tu peux passer à l’autre cas pour valider la notion.</small>':'<br><small>Relis le mécanisme, puis essaie une autre réponse.</small>'}</div>`;if(ok&&!s.solved[id+':'+idx]){s.solved[id+':'+idx]=true;s.xp+=15;save();$('#xp').textContent=s.xp+' XP studio'+(classicXP?' · '+classicXP+' XP classique':'')}})}
if(st===4){let localIndex=0,flipped=false;const paint=()=>{const f=c.flashcards[localIndex];$('#localFlash').innerHTML=`<div class="flashcard" id="flashFlip"><div class="eyebrow">CARTE ${localIndex+1}/3 · ${flipped?'VERSO':'RECTO'}</div>${flipped?`<div class="back">${esc(f.a)}</div>`:`<q>${esc(f.q)}</q>`}<div class="help">Toucher la carte pour ${flipped?'revenir à la question':'révéler la réponse'}</div></div><div class="flash-actions"><button class="button alt small" data-local="prev">← Précédente</button><button class="button small" data-local="next">Suivante →</button></div>`;$('#flashFlip').onclick=()=>{flipped=!flipped;paint()};document.querySelectorAll('[data-local]').forEach(b=>b.onclick=()=>{localIndex=(localIndex+(b.dataset.local==='next'?1:2))%3;flipped=false;paint()})};paint()}
if(st===5){const ta=$('#freeAnswer');ta.oninput=()=>{s.answers[id]=ta.value;save()};$('#rubricBtn').onclick=()=>{$('#rubric').hidden=!$('#rubric').hidden}}}
function setupReview(){let f=$('#reviewFlip');if(!f)return;f.onclick=()=>{let flip=f.querySelector('.back');flip.hidden=!flip.hidden;f.querySelector('.help').textContent=flip.hidden?'Toucher pour voir la réponse':'Tu l’aurais expliqué sans regarder ?';$('#reviewActions').hidden=flip.hidden};document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{let k=s.currentReview,prev=s.cards[k]?.level||0,good=b.dataset.grade==='good';let level=good?Math.min(prev+1,5):0;let days=[0,1,3,7,14,30][level];const d=new Date();d.setDate(d.getDate()+days);s.cards[k]={level,due:d.toISOString().slice(0,10)};s.currentReview=null;save();render()})}
$('#reloadBtn').onclick=()=>location.reload();$('#themeBtn').onclick=()=>{s.theme=s.theme==='dark'?'light':'dark';save();render()};window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&Number.isFinite(e.data.qcClassicHeight)){const fr=document.getElementById('classicFrame');if(fr&&e.source===fr.contentWindow)fr.style.height=Math.min(7000,e.data.qcClassicHeight)+'px'}});window.addEventListener('hashchange',render);render();
</script><script src="register-sw.js" defer></script></body></html>
